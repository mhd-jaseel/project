<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM Store Admin - Add Category</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        /* Admin Dashboard Styles */
        :root {
            --primary-color: #0f9d58;
            /* Reuse green from main site */
            --sidebar-bg: #1e1e2d;
            --sidebar-text: #9899ac;
            --sidebar-active: #ffffff;
            --sidebar-active-bg: #0f9d58;
            --body-bg: #f5f8fa;
            --card-bg: #ffffff;
            --text-dark: #3f4254;
            --text-muted: #b5b5c3;
        }

        body {
            font-family: 'Inter', 'Poppins', sans-serif;
            background-color: var(--body-bg);
            color: var(--text-dark);
            margin: 0;
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 20px;
            z-index: 1000;
            overflow-y: auto;
            transition: all 0.3s;
        }

        .sidebar .brand {
            padding: 0 25px 20px 25px;
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        .sidebar .menu-label {
            padding: 10px 25px;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--sidebar-text);
            font-weight: 600;
            letter-spacing: 0.05rem;
        }

        .sidebar .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 25px;
            color: var(--sidebar-text);
            text-decoration: none;
            transition: all 0.2s;
            font-size: 0.9rem;
            border-left: 3px solid transparent;
        }

        .sidebar .nav-link:hover {
            color: var(--sidebar-active);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .sidebar .nav-link.active {
            color: var(--sidebar-active);
            background-color: rgba(15, 157, 88, 0.1);
            /* Light green tint */
            border-left-color: var(--primary-color);
        }

        .sidebar .nav-link i {
            width: 25px;
            font-size: 1.1rem;
            margin-right: 10px;
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 0;
            min-height: 100vh;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .top-header {
            background-color: #fff;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 0 20px 0 rgba(76, 87, 125, 0.02);
        }

        .search-bar input {
            background-color: #f5f8fa;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            width: 300px;
            color: var(--text-dark);
        }

        .search-bar input:focus {
            outline: none;
            background-color: #ebf0f5;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-profile .icon-btn {
            background: none;
            border: none;
            color: #b5b5c3;
            font-size: 1.2rem;
            cursor: pointer;
            position: relative;
        }

        .user-profile .icon-btn .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 0.6rem;
        }

        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }

        /* Content Area */
        .content-wrapper {
            padding: 30px;
            flex-grow: 1;
        }

        /* Cards */
        .card-custom {
            background-color: var(--card-bg);
            border: none;
            border-radius: 12px;
            box-shadow: 0 0 20px 0 rgba(76, 87, 125, 0.02);
            padding: 25px;
            height: 100%;
            margin-bottom: 25px;
        }

        .stat-card h3 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        .stat-card .icon-box {
            width: 50px;
            height: 50px;
            background-color: rgba(15, 157, 88, 0.1);
            color: var(--primary-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .sidebar {
                left: -260px;
            }

            .sidebar.show {
                left: 0;
            }

            .main-content {
                margin-left: 0;
            }
        }

        /* Customer Details Profile Header */
        .profile-header-card {
            background: linear-gradient(135deg, #0f9d58 0%, #0ba360 100%);
            color: white;
            border-radius: 12px 12px 0 0;
            padding: 30px;
            margin-bottom: -40px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="brand">
            <i class="fas fa-leaf me-2 text-success"></i>KM Admin
        </div>
        <a href="dashboard.html" class="nav-link">
            <i class="fas fa-th-large"></i> Dashboard
        </a>
        <a href="order-management.html" class="nav-link">
            <i class="fas fa-shopping-bag"></i> Order Management
        </a>
        <a href="customers.html" class="nav-link">
            <i class="fas fa-users"></i> Customers
        </a>
        <a href="coupon.html" class="nav-link">
            <i class="fas fa-ticket-alt"></i> Coupon Code
        </a>
        <a href="banner.html" class="nav-link">
            <i class="fas fa-image"></i> Banner
        </a>
        <a href="sales-offers.html" class="nav-link">
            <i class="fas fa-percentage"></i> Sales Offers
        </a>
        <a href="transaction.html" class="nav-link">
            <i class="fas fa-wallet"></i> Transaction
        </a>
        <a href="categories.html" class="nav-link active">
            <i class="fas fa-th-list"></i> Categories
        </a>

        <a href="all-products.html" class="nav-link">
            <i class="fas fa-boxes"></i> All Products
        </a>
        <a href="feature-brands.html" class="nav-link">
            <i class="fas fa-star"></i> Featured Brands
        </a>
        <a href="admin-role.html" class="nav-link">
            <i class="fas fa-user-shield"></i> Settings
        </a>
        <div class="mt-auto p-4">
            <a href="../user/login.html" class="btn btn-outline-danger w-100 btn-sm"><i
                    class="fas fa-sign-out-alt me-2"></i>Logout</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <div class="d-flex align-items-center">
                <button class="btn btn-link text-dark d-lg-none me-3" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

        </header>

        <!-- Content Area -->
        <div class="content-wrapper">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card-custom">
                        <h5 class="fw-bold mb-4">Add New Category</h5>
                        <form>
                            <div class="mb-3">
                                <label class="form-label text-muted small">Category Name</label>
                                <input type="text" class="form-control" id="categoryName" placeholder="e.g. Vegetables"
                                    required>
                            </div>



                            <div class="mb-4">
                                <label class="form-label text-muted small">Category Image</label>
                                <input type="file" class="form-control" id="categoryImage" accept="image/*" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-muted small">Image Size (%)</label>
                                <input type="range" class="form-range" id="imageSizeRange" min="20" max="150"
                                    value="100">
                                <div class="text-center small" id="imageSizeValue">100%</div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary-custom" id="btnSaveCategory">
                                    Save Category
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

                <!-- Recent Categories -->
                <div class="col-lg-6">
                    <div class="card-custom">
                        <h5 class="fw-bold mb-4">Existing Categories</h5>
                        <ul class="list-group list-group-flush" id="categoryList"></ul>


                    </div>
                </div>
            </div>

        </div>
    </div>





    <!-- Notification Script -->



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 1. Auth Check
        const token = localStorage.getItem("adminToken");
        const role = localStorage.getItem("role");

        if (!token || role !== "admin") {
            window.location.href = "/user/login.html";
        }

        document.querySelector("form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const nameInput = document.getElementById("categoryName");
            const originalName = nameInput.value.trim();
            const imageInput = document.getElementById("categoryImage");

            // Reset Errors
            document.querySelectorAll('form .invalid-feedback').forEach(el => el.remove());
            document.querySelectorAll('form .is-invalid').forEach(el => el.classList.remove('is-invalid'));

            let isValid = true;
            const showError = (elementId, message) => {
                const input = document.getElementById(elementId);
                if (input) {
                    input.classList.add('is-invalid');
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'invalid-feedback text-danger small mt-1';
                    errorDiv.innerText = message;
                    input.parentNode.appendChild(errorDiv);
                }
                isValid = false;
            };

            // Validation Rules
            if (!originalName) {
                showError('categoryName', "Category Name is required.");
            } else if (originalName.length < 3) {
                showError('categoryName', "Category Name must be at least 3 characters long.");
            } else if (originalName.length > 50) {
                showError('categoryName', "Category Name cannot exceed 50 characters.");
            } else {
                const nameRegex = /^[A-Za-z0-9&]+( [A-Za-z0-9&]+)*$/;
                if (!nameRegex.test(originalName)) {
                    showError('categoryName', "Category Name must contain only letters, numbers, and '&', with single spaces between words.");
                }
            }



            if (!isValid) return;

            // --- NEW VALIDATION LOGIC ---
            // 1. Normalize: Remove ALL spaces and make lowercase
            // "Fr   uits" -> "fruits"
            const normalizedInput = originalName.replace(/\s+/g, '').toLowerCase();

            try {
                // 2. Fetch existing categories to check duplicates
                const checkRes = await fetch("/api/categories");
                const existingCategories = await checkRes.json();

                const isDuplicate = existingCategories.some(cat => {
                    const normalizedExisting = cat.name.replace(/\s+/g, '').toLowerCase();
                    return normalizedExisting === normalizedInput;
                });

                if (isDuplicate) {
                    showError('categoryName', "This category already exists (even with different spacing or case)!");
                    return;
                }
                // --- END OF NEW VALIDATION ---

                const formData = new FormData();
                formData.append("name", originalName);
                formData.append("imageSize", document.getElementById("imageSizeRange").value);

                if (imageInput.files.length > 0) {
                    formData.append("image", imageInput.files[0]);
                }

                const res = await fetch("/api/categories", {
                    method: "POST",
                    headers: {
                        Authorization: `Bearer ${token}`
                    },
                    body: formData
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || "Failed to add category");
                }

                alert("✅ Category added successfully");
                location.reload();

            } catch (err) {
                console.error("Submission Error:", err);
                alert(err.message);
                nameInput.classList.add("is-invalid");
            }
        });

        // Load Existing Categories
        async function loadExistingCategories() {
            try {
                const res = await fetch("/api/categories");
                const categories = await res.json();
                const list = document.getElementById("categoryList");
                list.innerHTML = "";

                if (categories.length === 0) {
                    list.innerHTML = '<li class="list-group-item text-muted text-center">No categories found</li>';
                    return;
                }

                categories.forEach(cat => {
                    const li = document.createElement("li");
                    li.className = "list-group-item d-flex justify-content-between align-items-center";
                    li.innerHTML = `
                        <div class="d-flex align-items-center">
                            <img src="${cat.image || `https://ui-avatars.com/api/?name=${encodeURIComponent(cat.name)}&background=0f9d58&color=fff&size=40`}" alt="${cat.name}" class="rounded me-3" style="width: 40px; height: 40px; object-fit: cover;">
                            <div>
                                <h6 class="mb-0 fw-bold">${cat.name}</h6>
                            </div>
                        </div>
                    `;
                    list.appendChild(li);
                });
            } catch (err) {
                console.error("Failed to load categories", err);
            }
        }

        loadExistingCategories();

        document.getElementById('imageSizeRange').addEventListener('input', function (e) {
            document.getElementById('imageSizeValue').textContent = e.target.value + '%';
        });
    </script>




</body>

</html>
