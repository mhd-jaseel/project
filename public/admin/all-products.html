<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM Store Admin - All Products</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        /* Admin Dashboard Styles */
        :root {
            --primary-color: #0f9d58;
            /* Reuse green from main site */
            --sidebar-bg: #1e1e2d;
            --sidebar-text: #9899ac;
            --sidebar-active: #ffffff;
            --sidebar-active-bg: #0f9d58;
            --body-bg: #f5f8fa;
            --card-bg: #ffffff;
            --text-dark: #3f4254;
            --text-muted: #b5b5c3;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--body-bg);
            color: var(--text-dark);
            margin: 0;
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 20px;
            z-index: 1000;
            overflow-y: auto;
            transition: all 0.3s;
        }

        .sidebar .brand {
            padding: 0 25px 20px 25px;
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        .sidebar .menu-label {
            padding: 10px 25px;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--sidebar-text);
            font-weight: 600;
            letter-spacing: 0.05rem;
        }

        .sidebar .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 25px;
            color: var(--sidebar-text);
            text-decoration: none;
            transition: all 0.2s;
            font-size: 0.9rem;
            border-left: 3px solid transparent;
        }

        .sidebar .nav-link:hover {
            color: var(--sidebar-active);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .sidebar .nav-link.active {
            color: var(--sidebar-active);
            background-color: rgba(15, 157, 88, 0.1);
            /* Light green tint */
            border-left-color: var(--primary-color);
        }

        .sidebar .nav-link i {
            width: 25px;
            font-size: 1.1rem;
            margin-right: 10px;
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 0;
            min-height: 100vh;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .top-header {
            background-color: #fff;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 0 20px 0 rgba(76, 87, 125, 0.02);
        }

        .search-bar input {
            background-color: #f5f8fa;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            width: 300px;
            color: var(--text-dark);
        }

        .search-bar input:focus {
            outline: none;
            background-color: #ebf0f5;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-profile .icon-btn {
            background: none;
            border: none;
            color: #b5b5c3;
            font-size: 1.2rem;
            cursor: pointer;
            position: relative;
        }

        .user-profile .icon-btn .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 0.6rem;
        }

        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }

        /* Content Area */
        .content-wrapper {
            padding: 30px;
            flex-grow: 1;
        }

        /* Cards */
        .card-custom {
            background-color: var(--card-bg);
            border: none;
            border-radius: 12px;
            box-shadow: 0 0 20px 0 rgba(76, 87, 125, 0.02);
            padding: 25px;
            height: 100%;
            margin-bottom: 25px;
        }

        .stat-card h3 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        .stat-card .icon-box {
            width: 50px;
            height: 50px;
            background-color: rgba(15, 157, 88, 0.1);
            color: var(--primary-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .sidebar {
                left: -260px;
            }

            .sidebar.show {
                left: 0;
            }

            .main-content {
                margin-left: 0;
            }
        }

        /* Customer Details Profile Header */
        .profile-header-card {
            background: linear-gradient(135deg, #0f9d58 0%, #0ba360 100%);
            color: white;
            border-radius: 12px 12px 0 0;
            padding: 30px;
            margin-bottom: -40px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="brand">
            <i class="fas fa-leaf me-2 text-success"></i>KM Admin
        </div>

        <div class="menu-label">Main Menu</div>
        <a href="dashboard.html" class="nav-link">
            <i class="fas fa-th-large"></i> Dashboard
        </a>
        <a href="order-management.html" class="nav-link">
            <i class="fas fa-shopping-bag"></i> Order Management
        </a>
        <a href="customers.html" class="nav-link">
            <i class="fas fa-users"></i> Customers
        </a>
        <a href="coupon.html" class="nav-link">
            <i class="fas fa-ticket-alt"></i> Coupon Code
        </a>
        <a href="banner.html" class="nav-link">
            <i class="fas fa-image"></i> Banner
        </a>
        <a href="sales-offers.html" class="nav-link">
            <i class="fas fa-percentage"></i> Sales Offers
        </a>
        <a href="transaction.html" class="nav-link">
            <i class="fas fa-wallet"></i> Transaction
        </a>
        <div class="menu-label mt-3">Products</div>
        <a href="categories.html" class="nav-link">
            <i class="fas fa-th-list"></i> Categories
        </a>

        <a href="all-products.html" class="nav-link active">
            <i class="fas fa-boxes"></i> All Products
        </a>
        <a href="feature-brands.html" class="nav-link">
            <i class="fas fa-star"></i> Featured Brands
        </a>

        <div class="menu-label mt-3">Admin</div>
        <a href="admin-role.html" class="nav-link">
            <i class="fas fa-user-shield"></i> Admin Role
        </a>
        <div class="mt-auto p-4">
            <a href="../user/login.html" class="btn btn-outline-danger w-100 btn-sm"><i
                    class="fas fa-sign-out-alt me-2"></i>Logout</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <div class="d-flex align-items-center">
                <button class="btn btn-link text-dark d-lg-none me-3" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <div class="user-profile">
                <!-- User Profile -->
                <button class="icon-btn"><i class="far fa-bell"></i><span
                        class="badge bg-danger rounded-circle">3</span></button>
                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark"
                        id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                        <img src="https://ui-avatars.com/api/?name=Admin+User&background=0D8ABC&color=fff" alt="mdo">
                    </a>
                    <ul class="dropdown-menu text-small shadow" aria-labelledby="dropdownUser1">
                        <li><a class="dropdown-item" href="../user/login.html">Sign out</a></li>
                    </ul>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="content-wrapper">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0">All Products</h4>
                <div class="d-flex gap-2">
                    <button class="btn btn-info text-white btn-sm"><i class="fas fa-boxes me-1"></i> Stock Info</button>
                    <a href="add-product.html" class="btn btn-primary-custom btn-sm"><i class="fas fa-plus"></i> Add New
                        Product</a>
                </div>
            </div>

            <div class="card-custom">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Hot Deal</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>

                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Edit Product Modal -->
            <div class="modal fade" id="editProductModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Edit Product</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form id="editProductForm">
                                <input type="hidden" id="editProductId">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Product Name</label>
                                        <input type="text" class="form-control" id="editProductName" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Category</label>
                                        <select class="form-select" id="editProductCategory" required>
                                            <option value="">Select Category</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Price</label>
                                        <input type="number" class="form-control" id="editProductPrice" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Discount</label>
                                        <input type="number" class="form-control" id="editProductDiscount"
                                            placeholder="Optional">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Weight/Unit</label>
                                        <input type="text" class="form-control" id="editProductWeight">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Stock Status</label>
                                        <select class="form-select" id="editProductStatus">
                                            <option value="In Stock">In Stock</option>
                                            <option value="Low Stock">Low Stock</option>
                                            <option value="Out of Stock">Out of Stock</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Featured (Hot Deal)</label>
                                        <select class="form-select" id="editProductFeatured">
                                            <option value="false">No</option>
                                            <option value="true">Yes</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Description</label>
                                    <textarea class="form-control" id="editProductDescription" rows="3"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Product Image</label>
                                    <input type="file" class="form-control" id="editProductImage" accept="image/*">
                                    <div class="mt-2 text-center" id="currentProductImageContainer">
                                        <p class="text-muted small mb-1">Current Image:</p>
                                        <img id="currentProductImage" src="" alt="Current Image"
                                            style="max-height: 100px; max-width: 100%; border-radius: 5px;">
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="button" class="btn btn-primary" onclick="saveEditProduct()">Save
                                Changes</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.querySelector('.sidebar');
        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', () => {
                sidebar.classList.toggle('show');
            });
        }

        // Stock Update Logic
        document.querySelectorAll('.btn-stock-update').forEach(btn => {
            btn.addEventListener('click', function () {
                // Find the closest row and stock element
                const row = this.closest('tr');
                const stockBadge = row.querySelector('td:nth-child(5) span');
                const currentStatus = stockBadge.innerText;

                Swal.fire({
                    title: 'Update Stock',
                    html: `
                        <p>Current Status: <strong>${currentStatus}</strong></p>
                        <select id="swal-stock-status" class="form-select mb-3">
                            <option value="In Stock" ${currentStatus === 'In Stock' ? 'selected' : ''}>In Stock</option>
                            <option value="Low Stock" ${currentStatus === 'Low Stock' ? 'selected' : ''}>Low Stock</option>
                            <option value="Out of Stock" ${currentStatus === 'Out of Stock' ? 'selected' : ''}>Out of Stock</option>
                        </select>
                        <input type="number" id="swal-stock-qty" class="form-control" placeholder="Enter Quantity" value="50">
                    `,
                    showCancelButton: true,
                    confirmButtonText: 'Update',
                    confirmButtonColor: '#0f9d58',
                    preConfirm: () => {
                        const status = document.getElementById('swal-stock-status').value;
                        const qty = document.getElementById('swal-stock-qty').value;
                        if (!qty) {
                            Swal.showValidationMessage('Please enter quantity');
                        }
                        return { status, qty };
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        const { status, qty } = result.value;

                        // Update UI
                        let badgeClass = 'bg-success text-success';
                        if (status === 'Low Stock') badgeClass = 'bg-warning text-warning';
                        if (status === 'Out of Stock') badgeClass = 'bg-danger text-danger';

                        stockBadge.className = `badge ${badgeClass} bg-opacity-10 rounded-pill px-3 py-2`;
                        stockBadge.innerText = status;

                        Swal.fire('Updated!', `Stock updated to ${status} (${qty} items).`, 'success');
                    }
                });
            });
        });


        let allProducts = [];
        let editProductModalObj;

        async function loadCategoriesForModal() {
            try {
                const res = await fetch("/api/categories");
                const categories = await res.json();
                const select = document.getElementById("editProductCategory");
                select.innerHTML = '<option value="">Select Category</option>';
                categories.forEach(cat => {
                    select.innerHTML += `<option value="${cat._id}">${cat.name}</option>`;
                });
            } catch (err) {
                console.error("Failed to load categories", err);
            }
        }

        async function loadProducts() {
            try {
                const res = await fetch("/api/products");
                allProducts = await res.json();

                const tbody = document.querySelector("tbody");
                tbody.innerHTML = "";

                if (!allProducts.length) {
                    tbody.innerHTML = `
        <tr>
          <td colspan="7" class="text-center text-muted">
            No products found
          </td>
        </tr>
      `;
                    return;
                }

                allProducts.forEach(p => {
                    tbody.innerHTML += `
        <tr>
          <td>
            <img 
              src="${p.image || 'https://placehold.co/50'}" 
              width="50" 
              height="50"
              style="object-fit: cover;"
            >
          </td>

          <td>${p.name}</td>

          <td>${p.category?.name || "Uncategorized"}</td>

          <td>₹${p.price}</td>

          <td>
            <select class="form-select form-select-sm" 
                    onchange="changeStockStatus('${p._id}', this.value)"
                    style="width: 140px; font-weight: 500; color: ${p.status === 'Out of Stock' ? '#dc3545' : (p.status === 'Low Stock' ? '#ffc107' : '#198754')}; border-color: ${p.status === 'Out of Stock' ? '#dc3545' : (p.status === 'Low Stock' ? '#ffc107' : '#198754')};">
                <option value="In Stock" ${(!p.status || p.status === 'In Stock') ? 'selected' : ''} style="color:#198754;">In Stock</option>
                <option value="Low Stock" ${p.status === 'Low Stock' ? 'selected' : ''} style="color:#ffc107;">Low Stock</option>
                <option value="Out of Stock" ${p.status === 'Out of Stock' ? 'selected' : ''} style="color:#dc3545;">Out of Stock</option>
            </select>
          </td>

          <td>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" ${p.isHotDeal ? 'checked' : ''} onchange="toggleHotDeal('${p._id}', this.checked)" style="cursor: pointer;">
            </div>
          </td>

          <td>
            <button 
              class="btn btn-sm btn-primary me-2"
              onclick="openEditModal('${p._id}')">
              Edit
            </button>
            <button 
              class="btn btn-sm btn-danger"
              onclick="confirmDelete('${p._id}', this)">
              Delete
            </button>
          </td>
        </tr>
      `;
                });

            } catch (err) {
                console.error("❌ Failed to load products", err);
            }
        }

        loadProducts();
        loadCategoriesForModal();

        /* =========================
           EDIT PRODUCT LOGIC
        ========================= */
        function openEditModal(id) {
            const product = allProducts.find(p => p._id === id);
            if (!product) return;

            document.getElementById('editProductId').value = product._id;
            document.getElementById('editProductName').value = product.name;
            // Handle category population - ensure value matches option value
            const categoryId = typeof product.category === 'object' ? product.category._id : product.category;
            document.getElementById('editProductCategory').value = categoryId || "";

            document.getElementById('editProductPrice').value = product.price;
            document.getElementById('editProductDiscount').value = product.discount || "";
            document.getElementById('editProductWeight').value = product.weight || "";
            document.getElementById('editProductStatus').value = product.status || "In Stock";
            document.getElementById('editProductFeatured').value = product.featured ? "true" : "false";
            document.getElementById('editProductDescription').value = product.description || "";

            const imgPreview = document.getElementById('currentProductImage');
            if (product.image) {
                imgPreview.src = product.image;
                document.getElementById('currentProductImageContainer').style.display = 'block';
            } else {
                document.getElementById('currentProductImageContainer').style.display = 'none';
            }

            const modalEl = document.getElementById('editProductModal');
            editProductModalObj = new bootstrap.Modal(modalEl);
            editProductModalObj.show();
        }

        async function saveEditProduct() {
            const id = document.getElementById('editProductId').value;
            const name = document.getElementById('editProductName').value.trim();
            const category = document.getElementById('editProductCategory').value;
            const price = document.getElementById('editProductPrice').value;
            const discount = document.getElementById('editProductDiscount').value;
            const weight = document.getElementById('editProductWeight').value;
            const status = document.getElementById('editProductStatus').value;
            const featured = document.getElementById('editProductFeatured').value;
            const description = document.getElementById('editProductDescription').value.trim();
            const imageInput = document.getElementById('editProductImage');

            const token = localStorage.getItem("adminToken");

            if (!name || !price || !category) {
                Swal.fire("Error", "Name, Price, and Category are required", "warning");
                return;
            }

            const formData = new FormData();
            formData.append("name", name);
            formData.append("category", category);
            formData.append("price", price);
            if (discount) formData.append("discount", discount);
            formData.append("weight", weight);
            formData.append("status", status);
            formData.append("featured", featured);
            formData.append("description", description);

            if (imageInput.files.length > 0) {
                formData.append("image", imageInput.files[0]);
            }

            try {
                const res = await fetch(`/api/products/${id}`, {
                    method: "PUT",
                    headers: {
                        Authorization: `Bearer ${token}`
                    },
                    body: formData
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || "Update failed");
                }

                Swal.fire("Success", "Product updated successfully", "success");

                if (editProductModalObj) editProductModalObj.hide();
                loadProducts();

            } catch (err) {
                console.error(err);
                Swal.fire("Error", err.message, "error");
            }
        }

        async function deleteProduct(productId) {
            try {
                const token = localStorage.getItem("adminToken");
                if (!token) {
                    Swal.fire("Error", "Admin not logged in", "error");
                    return;
                }

                const res = await fetch(`/api/products/${productId}`, {
                    method: "DELETE",
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                });

                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.message || "Delete failed");
                }

                Swal.fire("Deleted!", "Product deleted successfully", "success");
                loadProducts();

            } catch (err) {
                console.error(err);
                Swal.fire("Error", err.message, "error");
            }
        }

        function confirmDelete(productId) {
            Swal.fire({
                title: "Are you sure?",
                text: "This product will be permanently deleted!",
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: "#d33",
                cancelButtonColor: "#3085d6",
                confirmButtonText: "Yes, delete it!"
            }).then((result) => {
                if (result.isConfirmed) {
                    deleteProduct(productId);
                }
            });
        }



        async function changeStockStatus(id, newStatus) {
            const token = localStorage.getItem("adminToken");
            if (!token) {
                Swal.fire("Error", "You must be logged in.", "error");
                return;
            }

            try {
                const res = await fetch(`/api/products/${id}/stock-status`, {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.message || "Failed to update stock status");
                }

                // Initial success feedback
                const Toast = Swal.mixin({
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 2000,
                    timerProgressBar: true
                });

                Toast.fire({
                    icon: 'success',
                    title: `Stock updated to ${newStatus}`
                });

                // Refresh to update colors properly
                loadProducts();

            } catch (err) {
                console.error(err);
                Swal.fire("Error", err.message, "error");
                loadProducts(); // Revert on failure
            }
        }

        async function toggleHotDeal(id, status) {
            const token = localStorage.getItem("adminToken");
            if (!token) {
                Swal.fire("Error", "You must be logged in.", "error");
                return;
            }

            try {
                const res = await fetch(`/api/products/${id}/hot-deal`, {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ isHotDeal: status })
                });

                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.message || "Failed to update hot deal status");
                }

                const Toast = Swal.mixin({
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 3000,
                    timerProgressBar: true
                });

                Toast.fire({
                    icon: 'success',
                    title: `Product marked as ${status ? 'Hot Deal' : 'Normal'}`
                });

            } catch (err) {
                console.error(err);
                Swal.fire("Error", err.message, "error");
                // Revert checkbox state if failed 
                loadProducts();
            }
        }
    </script>
</body>

</html>
