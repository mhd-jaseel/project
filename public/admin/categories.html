<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM Store Admin - Categories</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        /* Admin Dashboard Styles */
        :root {
            --primary-color: #0f9d58;
            /* Reuse green from main site */
            --sidebar-bg: #1e1e2d;
            --sidebar-text: #9899ac;
            --sidebar-active: #ffffff;
            --sidebar-active-bg: #0f9d58;
            --body-bg: #f5f8fa;
            --card-bg: #ffffff;
            --text-dark: #3f4254;
            --text-muted: #b5b5c3;
        }

        body {
            font-family: 'Inter', 'Poppins', sans-serif;
            background-color: var(--body-bg);
            color: var(--text-dark);
            margin: 0;
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 20px;
            z-index: 1000;
            overflow-y: auto;
            transition: all 0.3s;
        }

        .sidebar .brand {
            padding: 0 25px 20px 25px;
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        .sidebar .menu-label {
            padding: 10px 25px;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--sidebar-text);
            font-weight: 600;
            letter-spacing: 0.05rem;
        }

        .sidebar .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 25px;
            color: var(--sidebar-text);
            text-decoration: none;
            transition: all 0.2s;
            font-size: 0.9rem;
            border-left: 3px solid transparent;
        }

        .sidebar .nav-link:hover {
            color: var(--sidebar-active);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .sidebar .nav-link.active {
            color: var(--sidebar-active);
            background-color: rgba(15, 157, 88, 0.1);
            /* Light green tint */
            border-left-color: var(--primary-color);
        }

        .sidebar .nav-link i {
            width: 25px;
            font-size: 1.1rem;
            margin-right: 10px;
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 0;
            min-height: 100vh;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .top-header {
            background-color: #fff;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 0 20px 0 rgba(76, 87, 125, 0.02);
        }

        .search-bar input {
            background-color: #f5f8fa;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            width: 300px;
            color: var(--text-dark);
        }

        .search-bar input:focus {
            outline: none;
            background-color: #ebf0f5;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-profile .icon-btn {
            background: none;
            border: none;
            color: #b5b5c3;
            font-size: 1.2rem;
            cursor: pointer;
            position: relative;
        }

        .user-profile .icon-btn .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 0.6rem;
        }

        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }

        /* Content Area */
        .content-wrapper {
            padding: 30px;
            flex-grow: 1;
        }

        /* Cards */
        .card-custom {
            background-color: var(--card-bg);
            border: none;
            border-radius: 12px;
            box-shadow: 0 0 20px 0 rgba(76, 87, 125, 0.02);
            padding: 25px;
            height: 100%;
            margin-bottom: 25px;
        }

        .stat-card h3 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        .stat-card .icon-box {
            width: 50px;
            height: 50px;
            background-color: rgba(15, 157, 88, 0.1);
            color: var(--primary-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .sidebar {
                left: -260px;
            }

            .sidebar.show {
                left: 0;
            }

            .main-content {
                margin-left: 0;
            }
        }

        /* Customer Details Profile Header */
        .profile-header-card {
            background: linear-gradient(135deg, #0f9d58 0%, #0ba360 100%);
            color: white;
            border-radius: 12px 12px 0 0;
            padding: 30px;
            margin-bottom: -40px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
    <!-- SweetAlert2 -->

</head>

<body>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="brand">
            <i class="fas fa-leaf me-2 text-success"></i>KM Admin
        </div>
        <a href="dashboard.html" class="nav-link">
            <i class="fas fa-th-large"></i> Dashboard
        </a>
        <a href="order-management.html" class="nav-link">
            <i class="fas fa-shopping-bag"></i> Order Management
        </a>
        <a href="customers.html" class="nav-link">
            <i class="fas fa-users"></i> Customers
        </a>
        <a href="coupon.html" class="nav-link">
            <i class="fas fa-ticket-alt"></i> Coupon Code
        </a>
        <a href="banner.html" class="nav-link">
            <i class="fas fa-image"></i> Banner
        </a>
        <a href="sales-offers.html" class="nav-link">
            <i class="fas fa-percentage"></i> Sales Offers
        </a>
        <a href="transaction.html" class="nav-link">
            <i class="fas fa-wallet"></i> Transaction
        </a>
        <a href="categories.html" class="nav-link active">
            <i class="fas fa-th-list"></i> Categories
        </a>

        <a href="all-products.html" class="nav-link">
            <i class="fas fa-boxes"></i> All Products
        </a>
        <a href="feature-brands.html" class="nav-link">
            <i class="fas fa-star"></i> Featured Brands
        </a>
        <a href="admin-role.html" class="nav-link">
            <i class="fas fa-user-shield"></i> Settings
        </a>
        <div class="mt-auto p-4">
            <a href="../user/login.html" class="btn btn-outline-danger w-100 btn-sm"><i
                    class="fas fa-sign-out-alt me-2"></i>Logout</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <h4 class="fw-bold m-0 text-dark">Categories</h4>
            <div class="d-flex align-items-center gap-4">
                <div class="search-bar">
                    <input type="text" placeholder="Search data, users, or reports" class="bg-light border-0">
                </div>

            </div>
        </header>

        <!-- Content Area -->
        <div class="content-wrapper">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="fw-bold text-dark m-0">Discover</h5>
                <div class="d-flex gap-2">
                    <a href="add-category.html" class="btn btn-primary-custom px-4"><i class="fas fa-plus me-2"></i> Add
                        Categories</a>

                </div>
            </div>

            <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4" id="categoryGrid"></div>

            <!-- Edit Category Modal -->
            <div class="modal fade" id="editCategoryModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Edit Category</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form id="editCategoryForm">
                                <input type="hidden" id="editCategoryId">
                                <div class="mb-3">
                                    <label class="form-label">Category Name</label>
                                    <input type="text" class="form-control" id="editCategoryName" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Description</label>
                                    <textarea class="form-control" id="editCategoryDescription" rows="3"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Category Image</label>
                                    <input type="file" class="form-control" id="editCategoryImage" accept="image/*">
                                    <div class="mt-2 text-center" id="currentImagePreviewContainer">
                                        <p class="text-muted small mb-1">Current Image:</p>
                                        <img id="currentImagePreview" src="" alt="Current Image"
                                            style="max-height: 100px; max-width: 100%; border-radius: 5px;">
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="button" class="btn btn-primary" onclick="saveEditCategory()">Save
                                Changes</button>
                        </div>
                    </div>
                </div>
            </div>


        </div>
    </div>




    <!-- Notification Script -->



    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auth Check
        const token = localStorage.getItem("adminToken");

        const role = localStorage.getItem("role");

        if (!token || role !== "admin") {
            window.location.href = "/user/login.html";
        }

        /* =========================
       LOAD CATEGORIES
    ========================= */
        let allCategories = [];
        let editModalObj;

        async function loadCategories() {
            try {
                const res = await fetch("/api/categories");
                allCategories = await res.json();

                const urlParams = new URLSearchParams(window.location.search);
                const categoryId = urlParams.get('id');

                let displayCategories = allCategories;
                if (categoryId) {
                    displayCategories = allCategories.filter(cat => cat._id === categoryId);
                }

                const grid = document.getElementById("categoryGrid");
                grid.innerHTML = "";
                if (!displayCategories.length) {
                    grid.innerHTML = `
            <div class="col-12 text-center text-muted">
            No categories found
            </div>
        `;
                    return;
                }

                displayCategories.forEach(cat => {
                    grid.innerHTML += `
            <div class="col">
                <div class="card-custom p-3 d-flex justify-content-between align-items-center flex-row">

                <!-- CATEGORY CLICK AREA -->
                <a href="all-products.html?category=${cat._id}"
                    class="d-flex align-items-center gap-3 text-decoration-none text-dark">
                    <img 
                    src="${cat.image || 'https://placehold.co/60'}"
                    width="60"
                    height="60"
                    class="rounded"
                    style="object-fit: cover;"
                    onerror="this.src='https://placehold.co/60'">
                    <h6 class="fw-bold m-0">${cat.name}</h6>
                </a>

                <div class="d-flex gap-2">
                    <!-- EDIT BUTTON -->
                    <button
                        class="btn btn-sm btn-light text-primary"
                        onclick="openEditModal('${cat._id}')">
                        <i class="fas fa-edit"></i>
                    </button>

                    <!-- DELETE BUTTON -->
                    <button
                        class="btn btn-sm btn-light text-danger"
                        onclick="deleteCategory('${cat._id}', this)">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>

                </div>
            </div>
            `;

                });

            } catch (err) {
                console.error(err);
                Swal.fire("Error", "Failed to load categories", "error");
            }
        }

        /* =========================
           EDIT CATEGORY LOGIC
        ========================= */
        function openEditModal(id) {
            const category = allCategories.find(c => c._id === id);
            if (!category) return;

            document.getElementById('editCategoryId').value = category._id;
            document.getElementById('editCategoryName').value = category.name;
            document.getElementById('editCategoryDescription').value = category.description || '';

            const imgPreview = document.getElementById('currentImagePreview');
            if (category.image) {
                imgPreview.src = category.image;
                document.getElementById('currentImagePreviewContainer').style.display = 'block';
            } else {
                document.getElementById('currentImagePreviewContainer').style.display = 'none';
            }

            // Initialize and show modal
            const modalEl = document.getElementById('editCategoryModal');
            editModalObj = new bootstrap.Modal(modalEl);
            editModalObj.show();
        }

        async function saveEditCategory() {
            const id = document.getElementById('editCategoryId').value;
            const name = document.getElementById('editCategoryName').value.trim();
            const description = document.getElementById('editCategoryDescription').value.trim();
            const imageInput = document.getElementById('editCategoryImage');
            const token = localStorage.getItem('adminToken');

            if (!name) {
                Swal.fire("Error", "Category name is required", "error");
                return;
            }

            const formData = new FormData();
            formData.append("name", name);
            formData.append("description", description);
            if (imageInput.files.length > 0) {
                formData.append("image", imageInput.files[0]);
            }

            try {
                const res = await fetch(`/api/categories/${id}`, {
                    method: "PUT",
                    headers: {
                        Authorization: `Bearer ${token}`
                    },
                    body: formData
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || "Update failed");
                }

                Swal.fire("Success", "Category updated successfully", "success");

                // Close modal
                if (editModalObj) editModalObj.hide();

                // Reload categories
                loadCategories();

            } catch (err) {
                console.error(err);
                Swal.fire("Error", err.message, "error");
            }
        }

        /* =========================
           DELETE CATEGORY (WITH CONFIRMATION)
        ========================= */
        async function deleteCategory(id, btn) {
            const token = localStorage.getItem("adminToken");


            if (!token) {
                Swal.fire("Unauthorized", "Please login again", "warning");
                return;
            }

            Swal.fire({
                title: "Are you sure?",
                text: "This category will be permanently deleted!",
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: "#d33",
                cancelButtonColor: "#3085d6",
                confirmButtonText: "Yes, delete it!"
            }).then(async (result) => {
                if (!result.isConfirmed) return;

                try {
                    const res = await fetch(`/api/categories/${id}`, {
                        method: "DELETE",
                        headers: {
                            Authorization: `Bearer ${token}`
                        }
                    });

                    const data = await res.json();

                    if (!res.ok) {
                        throw new Error(data.message || "Delete failed");
                    }

                    Swal.fire("Deleted!", "Category has been deleted.", "success");

                    // Remove from UI
                    btn.closest(".col").remove();

                } catch (err) {
                    console.error(err);
                    Swal.fire("Error", err.message, "error");
                }
            });
        }

        /* =========================
           INIT
        ========================= */
        loadCategories();
        document.addEventListener("click", (e) => {
            const link = e.target.closest(".category-link");
            if (!link) return;

            const categoryId = link.dataset.id;

            // redirect to products page with category
            window.location.href = `all-products.html?category=${categoryId}`;
        });
    </script>




</body>

</html>
