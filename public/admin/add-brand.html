<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM Store Admin - Add Brand</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        /* Admin Dashboard Styles */
        :root {
            --primary-color: #0f9d58;
            /* Reuse green from main site */
            --sidebar-bg: #1e1e2d;
            --sidebar-text: #9899ac;
            --sidebar-active: #ffffff;
            --sidebar-active-bg: #0f9d58;
            --body-bg: #f5f8fa;
            --card-bg: #ffffff;
            --text-dark: #3f4254;
            --text-muted: #b5b5c3;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--body-bg);
            color: var(--text-dark);
            margin: 0;
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 20px;
            z-index: 1000;
            overflow-y: auto;
            transition: all 0.3s;
        }

        .sidebar .brand {
            padding: 0 25px 20px 25px;
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        .sidebar .menu-label {
            padding: 10px 25px;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--sidebar-text);
            font-weight: 600;
            letter-spacing: 0.05rem;
        }

        .sidebar .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 25px;
            color: var(--sidebar-text);
            text-decoration: none;
            transition: all 0.2s;
            font-size: 0.9rem;
            border-left: 3px solid transparent;
        }

        .sidebar .nav-link:hover {
            color: var(--sidebar-active);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .sidebar .nav-link.active {
            color: var(--sidebar-active);
            background-color: rgba(15, 157, 88, 0.1);
            /* Light green tint */
            border-left-color: var(--primary-color);
        }

        .sidebar .nav-link i {
            width: 25px;
            font-size: 1.1rem;
            margin-right: 10px;
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 0;
            min-height: 100vh;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .top-header {
            background-color: #fff;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 0 20px 0 rgba(76, 87, 125, 0.02);
        }



        /* Content Area */
        .content-wrapper {
            padding: 30px;
            flex-grow: 1;
        }

        /* Cards */
        .card-custom {
            background-color: var(--card-bg);
            border: none;
            border-radius: 12px;
            box-shadow: 0 0 20px 0 rgba(76, 87, 125, 0.02);
            padding: 25px;
            height: 100%;
            margin-bottom: 25px;
        }



        /* Responsive */
        @media (max-width: 992px) {
            .sidebar {
                left: -260px;
            }

            .sidebar.show {
                left: 0;
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
    <!-- SweetAlert2 -->

</head>

<body>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="brand">
            <i class="fas fa-leaf me-2 text-success"></i>KM Admin
        </div>
        <a href="dashboard.html" class="nav-link">
            <i class="fas fa-th-large"></i> Dashboard
        </a>
        <a href="order-management.html" class="nav-link">
            <i class="fas fa-shopping-bag"></i> Order Management
        </a>
        <a href="customers.html" class="nav-link">
            <i class="fas fa-users"></i> Customers
        </a>
        <a href="coupon.html" class="nav-link">
            <i class="fas fa-ticket-alt"></i> Coupon Code
        </a>
        <a href="banner.html" class="nav-link">
            <i class="fas fa-image"></i> Banner
        </a>
        <a href="sales-offers.html" class="nav-link">
            <i class="fas fa-percentage"></i> Sales Offers
        </a>
        <a href="transaction.html" class="nav-link">
            <i class="fas fa-wallet"></i> Transaction
        </a>
        <a href="categories.html" class="nav-link">
            <i class="fas fa-th-list"></i> Categories
        </a>

        <a href="all-products.html" class="nav-link">
            <i class="fas fa-boxes"></i> All Products
        </a>
        <a href="feature-brands.html" class="nav-link active">
            <i class="fas fa-star"></i> Featured Brands
        </a>
        <a href="admin-role.html" class="nav-link">
            <i class="fas fa-user-shield"></i> Settings
        </a>
        <div class="mt-auto p-4">
            <a href="../user/login.html" class="btn btn-outline-danger w-100 btn-sm"><i
                    class="fas fa-sign-out-alt me-2"></i>Logout</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <div class="d-flex align-items-center">
                <button class="btn btn-link text-dark d-lg-none me-3" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

        </header>

        <!-- Content Area -->
        <div class="content-wrapper">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card-custom">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="fw-bold m-0">Add New Featured Brand</h5>
                            <a href="feature-brands.html" class="btn btn-outline-secondary btn-sm"><i
                                    class="fas fa-arrow-left me-2"></i>Back</a>
                        </div>

                        <form id="addBrandForm">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label text-muted small">Brand Image <span
                                            class="text-danger">*</span></label>
                                    <input type="file" class="form-control" name="image" id="brandImageInput"
                                        accept="image/*" required>
                                    <div class="form-text">Recommended size: High quality background image.</div>
                                </div>

                                <div class="col-12 mt-3 text-center d-none" id="brandPreviewContainer">
                                    <img src="#" id="brandPreview" class="img-fluid rounded border shadow-sm"
                                        style="max-height: 200px;" alt="Brand Preview">
                                </div>

                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-primary-custom px-5">Upload Brand
                                        Image</button>
                                </div>
                            </div>
                        </form>


                    </div>
                </div>
            </div>

        </div>
    </div>





    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auth Check
        const token = localStorage.getItem("adminToken");
        const role = localStorage.getItem("role");

        if (!token || role !== "admin") {
            window.location.href = "/user/login.html";
        }

        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.querySelector('.sidebar');
        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', () => {
                sidebar.classList.toggle('show');
            });
        }

        // --- Brand Logic ---

        // Preview Image
        const imageInput = document.getElementById('brandImageInput');
        if (imageInput) {
            imageInput.addEventListener('change', function (e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        document.getElementById('brandPreview').src = e.target.result;
                        document.getElementById('brandPreviewContainer').classList.remove('d-none');
                    }
                    reader.readAsDataURL(file);
                }
            });
        }

        // Submit Form
        const addBrandForm = document.getElementById('addBrandForm');
        if (addBrandForm) {
            addBrandForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);

                // Get token here to ensure it's available
                const authToken = localStorage.getItem("adminToken");

                try {
                    const res = await fetch('/api/brands/add', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${authToken}` },
                        body: formData
                    });

                    if (res.ok) {
                        Swal.fire('Success!', 'Brand added successfully!', 'success')
                            .then(() => window.location.href = 'feature-brands.html');
                    } else {
                        const data = await res.json();
                        Swal.fire('Error!', data.message || 'Failed to add brand.', 'error');
                    }
                } catch (err) {
                    console.error(err);
                    Swal.fire('Error!', 'Something went wrong.', 'error');
                }
            });
        }
    </script>




</body>

</html>
