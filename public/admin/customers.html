<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM Store Admin - Customers</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        /* Admin Dashboard Styles - Modern Redesign */
        :root {
            --primary-color: #0f9d58;
            --secondary-color: #6c757d;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --info-color: #3b82f6;

            --sidebar-width: 260px;
            --sidebar-bg: #1e1e2d;
            --sidebar-text: #9899ac;
            --sidebar-active: #ffffff;
            --sidebar-active-bg: #0f9d58;

            --body-bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Inter', 'Poppins', sans-serif;
            background-color: var(--body-bg);
            color: var(--text-main);
            margin: 0;
            overflow-x: hidden;
        }

        /* Sidebar (Standard) */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 20px;
            z-index: 1000;
            overflow-y: auto;
            transition: all 0.3s;
        }

        .sidebar .brand {
            padding: 0 25px 20px 25px;
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
            display: block;
        }

        .sidebar .menu-label {
            padding: 10px 25px;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--sidebar-text);
            font-weight: 600;
            letter-spacing: 0.05rem;
        }

        .sidebar .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 25px;
            color: var(--sidebar-text);
            text-decoration: none;
            transition: all 0.2s;
            font-size: 0.9rem;
            border-left: 3px solid transparent;
        }

        .sidebar .nav-link:hover {
            color: var(--sidebar-active);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .sidebar .nav-link.active {
            color: var(--sidebar-active);
            background-color: rgba(15, 157, 88, 0.1);
            border-left-color: var(--primary-color);
        }

        .sidebar .nav-link i {
            width: 25px;
            font-size: 1.1rem;
            margin-right: 10px;
        }

        /* Main Content */
        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s ease;
        }

        /* Top Header */
        .top-header {
            background-color: #fff;
            height: 70px;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .search-bar input {
            background-color: #f9fafb;
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 8px;
            width: 320px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .search-bar input:focus {
            outline: none;
            background-color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(15, 157, 88, 0.1);
        }

        /* Content Area */
        .content-wrapper {
            padding: 32px;
            flex-grow: 1;
        }

        /* Modern Card */
        .card-custom {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(0, 0, 0, 0.03);
            padding: 0;
            overflow: hidden;
        }

        /* Modern Table */
        .table-responsive {
            padding-bottom: 0.5rem;
        }

        .table {
            margin-bottom: 0;
            width: 100%;
        }

        .table thead th {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
            background-color: #f9fafb;
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            white-space: nowrap;
        }

        .table tbody td {
            padding: 20px 24px;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .table tbody tr:last-child td {
            border-bottom: none;
        }

        .table tbody tr:hover {
            background-color: #f9fafb;
        }

        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            line-height: 1.5;
            text-transform: capitalize;
        }

        .status-badge::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
            background-color: currentColor;
        }

        .status-success {
            background-color: #d1fae5;
            color: #065f46;
        }

        .status-warning {
            background-color: #fef3c7;
            color: #92400e;
        }

        .status-danger {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .status-info {
            background-color: #dbeafe;
            color: #1e40af;
        }

        /* Pagination */
        .pagination {
            gap: 6px;
            padding: 1rem 0;
        }

        .page-item .page-link {
            border: 1px solid #e5e7eb;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.85rem;
            min-width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            background-color: #fff;
            padding: 0 12px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .page-item .page-link:hover {
            background-color: #f9fafb;
            color: var(--text-main);
            border-color: #d1d5db;
            transform: translateY(-1px);
        }

        .page-item.active .page-link {
            background-color: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 4px 6px -1px rgba(15, 157, 88, 0.3), 0 2px 4px -1px rgba(15, 157, 88, 0.15);
            z-index: 1;
        }

        .page-item.disabled .page-link {
            color: #9ca3af;
            background-color: #f3f4f6;
            border-color: transparent;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.8;
        }

        /* Responsive Sidebar */
        @media (max-width: 991px) {
            .sidebar {
                transform: translateX(-100%);
                left: 0;
            }

            .sidebar.show {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }
        }

        /* Utils */
        .bg-soft-primary {
            background-color: rgba(15, 157, 88, 0.1);
            color: var(--primary-color);
        }

        .btn-action {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .btn-action:hover {
            background-color: #f3f4f6;
            color: var(--text-main);
        }
    </style>
    <!-- SweetAlert2 -->

</head>

<body>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="brand">
            <i class="fas fa-leaf me-2 text-success"></i>KM Admin
        </div>
        <a href="dashboard.html" class="nav-link">
            <i class="fas fa-th-large"></i> Dashboard
        </a>
        <a href="order-management.html" class="nav-link">
            <i class="fas fa-shopping-bag"></i> Order Management
        </a>
        <a href="customers.html" class="nav-link active">
            <i class="fas fa-users"></i> Customers
        </a>
        <a href="coupon.html" class="nav-link">
            <i class="fas fa-ticket-alt"></i> Coupon Code
        </a>
        <a href="banner.html" class="nav-link">
            <i class="fas fa-image"></i> Banner
        </a>
        <a href="sales-offers.html" class="nav-link">
            <i class="fas fa-percentage"></i> Sales Offers
        </a>
        <a href="transaction.html" class="nav-link">
            <i class="fas fa-wallet"></i> Transaction
        </a>
        <!-- ... rest of sidebar ... -->
        <a href="categories.html" class="nav-link">
            <i class="fas fa-th-list"></i> Categories
        </a>

        <a href="all-products.html" class="nav-link">
            <i class="fas fa-boxes"></i> All Products
        </a>
        <a href="feature-brands.html" class="nav-link">
            <i class="fas fa-star"></i> Featured Brands
        </a>
        <a href="admin-role.html" class="nav-link">
            <i class="fas fa-user-shield"></i> Settings
        </a>
        <div class="mt-auto p-4">
            <a href="../user/login.html" class="btn btn-outline-danger w-100 btn-sm"><i
                    class="fas fa-sign-out-alt me-2"></i>Logout</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Header (Simplified Reuse) -->
        <header class="top-header">
            <div class="d-flex align-items-center">
                <button class="btn btn-link text-dark d-lg-none me-3" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="search-bar d-none d-md-block">
                    <input type="text" placeholder="Search customers...">
                </div>
            </div>

        </header>

        <!-- Content Area -->
        <div class="content-wrapper">
            <h4 class="fw-bold mb-4 text-main">All Customers</h4>

            <div class="card-custom">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Avatar</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>

                                <th>Orders</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>

                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <nav aria-label="Page navigation" class="mt-4 px-3 pb-3" id="paginationContainer">
                    <!-- Dynamic Pagination -->
                </nav>
            </div>
        </div>
    </div>


    <!-- Notification Script -->

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auth Check
        const token = localStorage.getItem("adminToken");
        const role = localStorage.getItem("role");

        if (!token || role !== "admin") {
            window.location.href = "/user/login.html";
        }

        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.querySelector('.sidebar');
        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', () => {
                sidebar.classList.toggle('show');
            });
        }

        let currentPage = 1;

        async function fetchCustomers(page = 1) {
            try {
                const res = await fetch(`/api/admin/customers?page=${page}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    const customers = data.customers || [];
                    const tbody = document.querySelector('tbody');
                    tbody.innerHTML = '';

                    if (customers.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="8" class="text-center">No customers found.</td></tr>';
                        return;
                    }

                    customers.forEach((customer, index) => {
                        const tr = document.createElement('tr');
                        tr.setAttribute('data-id', customer._id);

                        const isBlocked = customer.isBlocked ? true : false;
                        const statusBadge = isBlocked
                            ? '<span class="status-badge status-danger">Blocked</span>'
                            : '<span class="status-badge status-success">Active</span>';

                        const blockActionText = isBlocked ? 'Unblock' : 'Block';
                        const blockActionIcon = isBlocked ? 'fa-unlock' : 'fa-ban';
                        // Use a dropdown for actions
                        const actionMenu = `
                            <div class="dropdown">
                                <button class="btn btn-sm btn-light border-0 bg-transparent text-secondary" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="fas fa-ellipsis-v"></i>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end border-0 shadow-sm rounded-3">
                                    <li><a class="dropdown-item py-2" href="customer-details.html?id=${customer._id}"><i class="fas fa-eye me-2 text-primary"></i>View Details</a></li>
                                    <li><button class="dropdown-item py-2" onclick="blockUser('${customer._id}', ${isBlocked})"><i class="fas ${blockActionIcon} me-2 text-warning"></i>${blockActionText}</button></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li><button class="dropdown-item py-2 text-danger delete-btn" data-id="${customer._id}"><i class="fas fa-trash me-2"></i>Delete</button></li>
                                </ul>
                            </div>
                        `;

                        tr.innerHTML = `
                            <td><span class="fw-medium text-secondary">#${customer._id.substring(0, 8).toUpperCase()}</span></td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <img src="https://ui-avatars.com/api/?name=${customer.name}&background=random" class="rounded-circle me-3" width="36" height="36">
                                </div>
                            </td>
                            <td><span class="text-dark fw-bold">${customer.name}</span></td>
                            <td class="text-secondary">${customer.email}</td>
                            <td class="text-secondary">${customer.phoneNumber || 'N/A'}</td>

                            <td class="fw-bold">${customer.orderCount || 0}</td>
                            <td>${statusBadge}</td>
                            <td>
                                ${actionMenu}
                            </td>
                         `;
                        tbody.appendChild(tr);
                    });

                    renderPagination(data.totalPages, data.currentPage);
                }
            } catch (error) {
                console.error("Error fetching customers:", error);
            }
        }

        function renderPagination(total, current) {
            const container = document.getElementById("paginationContainer");
            if (total <= 1) {
                container.innerHTML = "";
                return;
            }

            let html = `<ul class="pagination justify-content-center mb-0">`;

            // Previous
            html += `<li class="page-item ${current === 1 ? 'disabled' : ''}">
                        <button class="page-link" onclick="fetchCustomers(${current - 1})">Previous</button>
                     </li>`;

            // Page Numbers
            for (let i = 1; i <= total; i++) {
                if (i === 1 || i === total || (i >= current - 1 && i <= current + 1)) {
                    html += `<li class="page-item ${i === current ? 'active' : ''}">
                                <button class="page-link" onclick="fetchCustomers(${i})">${i}</button>
                              </li>`;
                } else if (i === current - 2 || i === current + 2) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
            }

            // Next
            html += `<li class="page-item ${current === total ? 'disabled' : ''}">
                        <button class="page-link" onclick="fetchCustomers(${current + 1})">Next</button>
                     </li>`;

            html += `</ul>`;
            container.innerHTML = html;
        }

        async function deleteUser(id) {
            try {
                const res = await fetch(`/api/admin/customers/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    Swal.fire('Deleted!', 'User has been deleted.', 'success');
                    fetchCustomers(currentPage);
                } else {
                    Swal.fire('Error', 'Failed to delete user', 'error');
                }
            } catch (error) {
                Swal.fire('Error', 'Server error', 'error');
            }
        }

        window.blockUser = async (id, currentStatus) => {
            const action = currentStatus ? 'Unblock' : 'Block';
            const confirm = await Swal.fire({
                title: 'Are you sure?',
                text: `Do you want to ${action.toLowerCase()} this user?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: currentStatus ? '#3085d6' : '#d33',
                confirmButtonText: `Yes, ${action}!`
            });

            if (confirm.isConfirmed) {
                try {
                    const res = await fetch(`/api/admin/customers/${id}/block`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ isBlocked: !currentStatus })
                    });

                    if (res.ok) {
                        Swal.fire('Success', `User has been ${action}ed.`, 'success');
                        fetchCustomers(currentPage);
                    } else {
                        const data = await res.json();
                        Swal.fire('Error', data.message || 'Failed to update user status', 'error');
                    }
                } catch (error) {
                    Swal.fire('Error', 'Server error', 'error');
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => fetchCustomers());

        dcu_btn_listener = document.body.addEventListener('click', function (e) {
            const deleteBtn = e.target.closest('.delete-btn');
            if (deleteBtn) {
                e.preventDefault();
                const id = deleteBtn.getAttribute('data-id');
                Swal.fire({
                    title: 'Are you sure?',
                    text: "You won't be able to revert this!",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#3085d6',
                    confirmButtonText: 'Yes, delete it!'
                }).then((result) => {
                    if (result.isConfirmed) {
                        deleteUser(id);
                    }
                });
            }
        });
    </script>




</body>
