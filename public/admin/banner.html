<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM Store Admin - Banner</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        /* Admin Dashboard Styles */
        :root {
            --primary-color: #0f9d58;
            /* Reuse green from main site */
            --sidebar-bg: #1e1e2d;
            --sidebar-text: #9899ac;
            --sidebar-active: #ffffff;
            --sidebar-active-bg: #0f9d58;
            --body-bg: #f5f8fa;
            --card-bg: #ffffff;
            --text-dark: #3f4254;
            --text-muted: #b5b5c3;
        }

        body {
            font-family: 'Inter', 'Poppins', sans-serif;
            background-color: var(--body-bg);
            color: var(--text-dark);
            margin: 0;
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 20px;
            z-index: 1000;
            overflow-y: auto;
            transition: all 0.3s;
        }

        .sidebar .brand {
            padding: 0 25px 20px 25px;
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        .sidebar .menu-label {
            padding: 10px 25px;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--sidebar-text);
            font-weight: 600;
            letter-spacing: 0.05rem;
        }

        .sidebar .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 25px;
            color: var(--sidebar-text);
            text-decoration: none;
            transition: all 0.2s;
            font-size: 0.9rem;
            border-left: 3px solid transparent;
        }

        .sidebar .nav-link:hover {
            color: var(--sidebar-active);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .sidebar .nav-link.active {
            color: var(--sidebar-active);
            background-color: rgba(15, 157, 88, 0.1);
            /* Light green tint */
            border-left-color: var(--primary-color);
        }

        .sidebar .nav-link i {
            width: 25px;
            font-size: 1.1rem;
            margin-right: 10px;
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 0;
            min-height: 100vh;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .top-header {
            background-color: #fff;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 0 20px 0 rgba(76, 87, 125, 0.02);
        }

        .search-bar input {
            background-color: #f5f8fa;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            width: 300px;
            color: var(--text-dark);
        }

        .search-bar input:focus {
            outline: none;
            background-color: #ebf0f5;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-profile .icon-btn {
            background: none;
            border: none;
            color: #b5b5c3;
            font-size: 1.2rem;
            cursor: pointer;
            position: relative;
        }

        .user-profile .icon-btn .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 0.6rem;
        }

        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }

        /* Content Area */
        .content-wrapper {
            padding: 30px;
            flex-grow: 1;
        }

        /* Cards */
        .card-custom {
            background-color: var(--card-bg);
            border: none;
            border-radius: 12px;
            box-shadow: 0 0 20px 0 rgba(76, 87, 125, 0.02);
            padding: 25px;
            height: 100%;
            margin-bottom: 25px;
        }

        .stat-card h3 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        .stat-card .icon-box {
            width: 50px;
            height: 50px;
            background-color: rgba(15, 157, 88, 0.1);
            color: var(--primary-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .sidebar {
                left: -260px;
            }

            .sidebar.show {
                left: 0;
            }

            .main-content {
                margin-left: 0;
            }
        }

        /* Customer Details Profile Header */
        .profile-header-card {
            background: linear-gradient(135deg, #0f9d58 0%, #0ba360 100%);
            color: white;
            border-radius: 12px 12px 0 0;
            padding: 30px;
            margin-bottom: -40px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="brand">
            <i class="fas fa-leaf me-2 text-success"></i>KM Admin
        </div>
        <a href="dashboard.html" class="nav-link">
            <i class="fas fa-th-large"></i> Dashboard
        </a>
        <a href="order-management.html" class="nav-link">
            <i class="fas fa-shopping-bag"></i> Order Management
        </a>
        <a href="customers.html" class="nav-link">
            <i class="fas fa-users"></i> Customers
        </a>
        <a href="coupon.html" class="nav-link">
            <i class="fas fa-ticket-alt"></i> Coupon Code
        </a>
        <a href="banner.html" class="nav-link active">
            <i class="fas fa-image"></i> Banner
        </a>
        <a href="sales-offers.html" class="nav-link">
            <i class="fas fa-percentage"></i> Sales Offers
        </a>
        <a href="transaction.html" class="nav-link">
            <i class="fas fa-wallet"></i> Transaction
        </a>
        <a href="categories.html" class="nav-link">
            <i class="fas fa-th-list"></i> Categories
        </a>

        <a href="all-products.html" class="nav-link">
            <i class="fas fa-boxes"></i> All Products
        </a>
        <a href="feature-brands.html" class="nav-link">
            <i class="fas fa-star"></i> Featured Brands
        </a>
        <a href="admin-role.html" class="nav-link">
            <i class="fas fa-user-shield"></i> Settings
        </a>
        <div class="mt-auto p-4">
            <a href="../user/login.html" class="btn btn-outline-danger w-100 btn-sm"><i
                    class="fas fa-sign-out-alt me-2"></i>Logout</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <div class="d-flex align-items-center">
                <button class="btn btn-link text-dark d-lg-none me-3" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

        </header>

        <!-- Content Area -->
        <div class="content-wrapper">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0">Banner Management</h4>
                <button class="btn btn-primary-custom btn-sm" data-bs-toggle="modal" data-bs-target="#addBannerModal"><i
                        class="fas fa-plus"></i> Create New
                    Banner</button>
            </div>

            <div class="row" id="banner-list">
                <!-- Banners will be populated here -->
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Add Banner Modal -->
    <div class="modal fade" id="addBannerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">Add New Banner</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addBannerForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Banner Image <span class="text-danger">*</span></label>
                            <input type="file" class="form-control" name="image" id="bannerImageInput" accept="image/*"
                                required>
                            <div class="form-text">Recommended size: 1920x600 px</div>
                            <div class="mt-3 text-center d-none" id="imagePreviewContainer">
                                <img src="#" id="imagePreview" class="img-fluid rounded border shadow-sm"
                                    style="max-height: 150px;" alt="Banner Preview">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Title (Optional)</label>
                            <input type="text" class="form-control" name="title" placeholder="e.g. Summer Sale">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Subtitle (Optional)</label>
                            <input type="text" class="form-control" name="subtitle" placeholder="e.g. Up to 50% Off">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Button Text</label>
                            <input type="text" class="form-control" name="buttonText" value="Shop Now">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Link Type (Optional)</label>
                            <select class="form-select mb-2" id="linkTypeSelect"
                                onchange="handleLinkTypeChange(this, 'add')">
                                <option value="default">Default (All Products)</option>
                                <option value="category">Category Page</option>
                                <option value="product">Specific Product</option>
                                <option value="custom">Custom Link</option>
                            </select>
                            <div id="linkValueContainer_add">
                                <input type="text" class="form-control" name="link" id="linkInput_add"
                                    placeholder="product.html" value="product.html">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label fw-bold">Bg Color</label>
                                <input type="color" class="form-control form-control-color w-100" name="bgColor"
                                    value="#004d40" title="Choose background color">
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-bold">Text Color</label>
                                <input type="color" class="form-control form-control-color w-100" name="textColor"
                                    value="#ffffff" title="Choose text color">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label fw-bold">Btn Color</label>
                                <input type="color" class="form-control form-control-color w-100" name="buttonColor"
                                    value="#bef67a" title="Choose button color">
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-bold">Image Size (%)</label>
                                <input type="range" class="form-range" name="imageSize" min="20" max="150" value="100"
                                    id="imageSizeRange">
                                <div class="text-center small" id="imageSizeValue">100%</div>
                            </div>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="isActiveCheck" name="isActive" checked>
                            <label class="form-check-label" for="isActiveCheck">Active Immediately</label>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100">Upload Banner</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    </div>
    </div>

    <!-- Custom Modal Container -->
    <div id="edit-modals-container"></div>




    <!-- Notification Script -->



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auth Check
        const token = localStorage.getItem("adminToken");
        const role = localStorage.getItem("role");

        if (!token || role !== "admin") {
            window.location.href = "/user/login.html";
        }

        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.querySelector('.sidebar');
        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', () => {
                sidebar.classList.toggle('show');
            });
        }

        // --- Banner Logic ---
        document.addEventListener('DOMContentLoaded', fetchBanners);

        async function fetchBanners() {
            try {
                const res = await fetch('/api/banners/all', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const banners = await res.json();
                const container = document.getElementById('banner-list');

                if (banners.length === 0) {
                    container.innerHTML = '<div class="col-12 text-center text-muted">No banners found. Create one!</div>';
                    return;
                }

                container.innerHTML = banners.map(banner => `
                    <div class="col-md-6 mb-4">
                        <div class="card-custom h-100 p-0 overflow-hidden">
                            <div class="bg-light p-0 text-center position-relative overflow-hidden" style="height: 200px;">
                                <img src="${banner.imageUrl}" 
                                     class="w-100 h-100 object-fit-cover" alt="Banner">
                                <div class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center bg-dark bg-opacity-25 text-white">
                                     ${banner.title ? `<h3 class="fw-bold m-0">${banner.title}</h3>` : ''}
                                     ${banner.subtitle ? `<p class="lead m-0">${banner.subtitle}</p>` : ''}
                                     <div class="mt-2">
                                        <span class="badge bg-light text-dark small">Btn: ${banner.buttonText || 'Shop Now'}</span>
                                        <span class="badge bg-light text-dark small">Link: ${banner.link || '#'}</span>
                                     </div>
                                </div>
                            </div>
                            <div class="p-3">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="badge ${banner.isActive ? 'bg-success' : 'bg-secondary'}">
                                        ${banner.isActive ? 'Active' : 'Disabled'}
                                    </span>
                                    <small class="text-muted">${new Date(banner.createdAt).toLocaleDateString()}</small>
                                </div>
                                <div class="d-flex justify-content-end gap-2">
                                    <button onclick="editBanner('${banner._id}')" class="btn btn-sm btn-outline-primary">Edit</button>
                                    <button onclick="toggleBanner('${banner._id}')" 
                                        class="btn btn-sm ${banner.isActive ? 'btn-outline-warning' : 'btn-outline-success'}">
                                        ${banner.isActive ? 'Disable' : 'Enable'}
                                    </button>
                                    <button onclick="deleteBanner('${banner._id}')" class="btn btn-sm btn-outline-danger">Delete</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');

                // Generate individual modals for each banner to ensure isolated image handling
                const modalsContainer = document.getElementById('edit-modals-container');
                modalsContainer.innerHTML = banners.map(banner => `
                    <div class="modal fade" id="editBannerModal-${banner._id}" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content border-0 shadow">
                                <div class="modal-header bg-warning text-dark">
                                    <h5 class="modal-title fw-bold">Edit Banner</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <form onsubmit="handleBannerUpdate(event, '${banner._id}')">
                                        <div class="mb-3">
                                            <label class="form-label fw-bold">Banner Image (Optional)</label>
                                            <input type="file" class="form-control" name="image" id="editBannerImageInput-${banner._id}"
                                                accept="image/*" onchange="previewBannerImage(this, '${banner._id}')">
                                            <div class="form-text">Leave blank to keep current image</div>
                                            <div class="mt-3 text-center">
                                                <img src="${banner.imageUrl}" id="editImagePreview-${banner._id}" 
                                                    class="img-fluid rounded border shadow-sm"
                                                    style="max-height: 150px;" alt="Banner Preview">
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-bold">Title (Optional)</label>
                                            <input type="text" class="form-control" name="title" value="${banner.title || ''}">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-bold">Subtitle (Optional)</label>
                                            <input type="text" class="form-control" name="subtitle" value="${banner.subtitle || ''}">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-bold">Button Text</label>
                                            <input type="text" class="form-control" name="buttonText" value="${banner.buttonText || 'Shop Now'}">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-bold">Link</label>
                                            <input type="text" class="form-control" name="link" value="${banner.link || 'product.html'}">
                                        </div>
                                        <div class="row mb-3">
                                            <div class="col-6">
                                                <label class="form-label fw-bold">Bg Color</label>
                                                <input type="color" class="form-control form-control-color w-100" name="bgColor" value="${banner.bgColor || '#004d40'}">
                                            </div>
                                            <div class="col-6">
                                                <label class="form-label fw-bold">Text Color</label>
                                                <input type="color" class="form-control form-control-color w-100" name="textColor" value="${banner.textColor || '#ffffff'}">
                                            </div>
                                        </div>
                                        <div class="row mb-3">
                                            <div class="col-6">
                                                <label class="form-label fw-bold">Btn Color</label>
                                                <input type="color" class="form-control form-control-color w-100" name="buttonColor" value="${banner.buttonColor || '#bef67a'}">
                                            </div>
                                            <div class="col-6">
                                                <label class="form-label fw-bold">Image Size (%)</label>
                                                <input type="range" class="form-range" name="imageSize" min="20" max="150" value="${banner.imageSize || 100}"
                                                    oninput="document.getElementById('editImageSizeValue-${banner._id}').textContent = this.value + '%'">
                                                <div class="text-center small" id="editImageSizeValue-${banner._id}">${banner.imageSize || 100}%</div>
                                            </div>
                                        </div>
                                        <div class="form-check form-switch mb-3">
                                            <input class="form-check-input" type="checkbox" name="isActive" ${banner.isActive ? 'checked' : ''}>
                                            <label class="form-check-label">Active</label>
                                        </div>
                                        <button type="submit" class="btn btn-warning w-100 fw-bold">Update Banner</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
                document.getElementById('banner-list').innerHTML = '<div class="col-12 text-danger text-center">Failed to load banners</div>';
            }
        }

        document.getElementById('imageSizeRange')?.addEventListener('input', function (e) {
            document.getElementById('imageSizeValue').textContent = e.target.value + '%';
        });

        document.getElementById('bannerImageInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            const previewContainer = document.getElementById('imagePreviewContainer');
            const previewImage = document.getElementById('imagePreview');

            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    previewImage.src = e.target.result;
                    previewContainer.classList.remove('d-none');
                }
                reader.readAsDataURL(file);
            } else {
                previewContainer.classList.add('d-none');
                previewImage.src = '#';
            }
        });

        document.getElementById('addBannerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            // Append isActive as a boolean string
            formData.set('isActive', document.getElementById('isActiveCheck').checked);

            try {
                const res = await fetch('/api/banners/add', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('addBannerModal')).hide();
                    e.target.reset();
                    document.getElementById('imagePreviewContainer').classList.add('d-none'); // Reset preview
                    fetchBanners();
                    alert('Banner added successfully');
                } else {
                    alert('Failed to add banner');
                }
            } catch (err) {
                console.error(err);
                alert('Error adding banner');
            }
        });

        // Helper for Link Type Choice
        let globalCategories = [];
        let globalProducts = [];

        async function handleLinkTypeChange(select, mode) {
            const type = select.value;
            const container = document.getElementById(`linkValueContainer_${mode}`);
            const inputId = mode === 'edit' ? 'editLink' : 'linkInput_add';

            if (type === 'default') {
                container.innerHTML = `<input type="text" class="form-control" name="link" id="${inputId}" value="product.html" readonly>`;
            } else if (type === 'category') {
                if (globalCategories.length === 0) {
                    const res = await fetch('/api/categories');
                    globalCategories = await res.json();
                }
                let html = `<select class="form-select" name="link" id="${inputId}">`;
                globalCategories.forEach(c => {
                    html += `<option value="product.html?category=${c._id}">${c.name}</option>`;
                });
                html += `</select>`;
                container.innerHTML = html;
            } else if (type === 'product') {
                if (globalProducts.length === 0) {
                    const res = await fetch('/api/products?limit=100');
                    const data = await res.json();
                    globalProducts = data.products || data;
                }
                let html = `<select class="form-select" name="link" id="${inputId}">`;
                globalProducts.forEach(p => {
                    html += `<option value="single-product.html?id=${p._id}">${p.name}</option>`;
                });
                html += `</select>`;
                container.innerHTML = html;
            } else {
                container.innerHTML = `<input type="text" class="form-control" name="link" id="${inputId}" placeholder="e.g. product.html">`;
            }
        }

        function editBanner(id) {
            new bootstrap.Modal(document.getElementById(`editBannerModal-${id}`)).show();
        }

        function previewBannerImage(input, id) {
            const file = input.files[0];
            const preview = document.getElementById(`editImagePreview-${id}`);
            if (file) {
                const reader = new FileReader();
                reader.onload = e => preview.src = e.target.result;
                reader.readAsDataURL(file);
            }
        }

        async function handleBannerUpdate(e, id) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);

            // Set isActive properly since checkbox behavior in FormData can be tricky
            const isActive = form.querySelector('[name="isActive"]').checked;
            formData.set('isActive', isActive);

            try {
                const res = await fetch(`/api/banners/${id}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById(`editBannerModal-${id}`)).hide();
                    fetchBanners();
                    alert('Banner updated successfully');
                } else {
                    alert('Failed to update banner');
                }
            } catch (err) {
                console.error(err);
                alert('Connection error');
            }
        }

        async function toggleBanner(id) {
            if (!confirm('Change banner status?')) return;
            try {
                const res = await fetch(`/api/banners/${id}/toggle`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) fetchBanners();
            } catch (err) { console.error(err); }
        }

        async function deleteBanner(id) {
            if (!confirm('Are you sure you want to delete this banner?')) return;
            try {
                const res = await fetch(`/api/banners/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) fetchBanners();
            } catch (err) { console.error(err); }
        }


    </script>
