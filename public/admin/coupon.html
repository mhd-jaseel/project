<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM Store Admin - Coupon Code</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        :root {
            /* Standard Sidebar Vars */
            --primary-color: #0f9d58;
            --sidebar-bg: #1e1e2d;
            --sidebar-text: #9899ac;
            --sidebar-active: #ffffff;
            --sidebar-active-bg: #0f9d58;

            /* New Design Vars */
            --primary-light: rgba(15, 157, 88, 0.1);
            --secondary-color: #3b82f6;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --bg-light: #f1f5f9;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --sidebar-width: 260px;
        }

        body {
            font-family: 'Inter', 'Poppins', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            margin: 0;
            overflow-x: hidden;
        }

        /* Sidebar Styles (Standard) */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 20px;
            z-index: 1000;
            overflow-y: auto;
            transition: all 0.3s;
        }

        .sidebar .brand {
            padding: 0 25px 20px 25px;
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
            display: block;
        }

        .sidebar .menu-label {
            padding: 10px 25px;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--sidebar-text);
            font-weight: 600;
            letter-spacing: 0.05rem;
        }

        .sidebar .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 25px;
            color: var(--sidebar-text);
            text-decoration: none;
            transition: all 0.2s;
            font-size: 0.9rem;
            border-left: 3px solid transparent;
        }

        .sidebar .nav-link:hover {
            color: var(--sidebar-active);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .sidebar .nav-link.active {
            color: var(--sidebar-active);
            background-color: rgba(15, 157, 88, 0.1);
            border-left-color: var(--primary-color);
        }

        .sidebar .nav-link i {
            width: 25px;
            font-size: 1.1rem;
            margin-right: 10px;
        }

        /* Main Content */
        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s;
        }

        /* Top Header */
        .top-header {
            background: #fff;
            height: 64px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .content-wrapper {
            padding: 24px;
            flex: 1;
        }

        /* Enhanced Cards */
        .card-custom {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .card-header-styled {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header-styled h5 {
            margin: 0;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-body-custom {
            padding: 24px;
        }

        /* Form Controls */
        .form-label {
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-size: 0.85rem;
        }

        .form-control,
        .form-select {
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            font-size: 0.9rem;
            transition: all 0.2s;
            background-color: #f8fafc;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(15, 157, 88, 0.1);
        }

        .input-group .btn {
            z-index: 0;
        }

        /* Modern Buttons */
        .btn {
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-success {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .btn-success:hover {
            background-color: #0b7d46;
            border-color: #0b7d46;
            transform: translateY(-1px);
        }

        .btn-outline-primary {
            color: var(--secondary-color);
            border-color: var(--secondary-color);
        }

        .btn-outline-primary:hover {
            background-color: var(--secondary-color);
            color: white;
        }

        /* Tables */
        .table-responsive {
            border: none;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead th {
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
        }

        .table tbody td {
            padding: 16px 24px;
            vertical-align: middle;
            color: var(--text-dark);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .table tbody tr:last-child td {
            border-bottom: none;
        }

        .table tbody tr:hover {
            background-color: #fafbfc;
        }

        /* Custom Status Badges (overriding Bootstrap classes via specificity or !important logic handled in CSS modules, here just straight styles) */
        .badge.bg-success {
            background-color: rgba(15, 157, 88, 0.1) !important;
            color: #0f9d58;
            border: 1px solid rgba(15, 157, 88, 0.2);
            padding: 6px 12px;
            border-radius: 30px;
            font-weight: 600;
        }

        .badge.bg-danger {
            background-color: rgba(239, 68, 68, 0.1) !important;
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 6px 12px;
            border-radius: 30px;
            font-weight: 600;
        }

        .badge.bg-info {
            background-color: rgba(59, 130, 246, 0.1) !important;
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 6px 12px;
            border-radius: 30px;
            font-weight: 600;
        }

        /* Modal Polish */
        .modal-content {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .modal-header {
            border-bottom: 1px solid var(--border-color);
            padding: 20px 24px;
            background: #f8fafc;
            border-radius: 16px 16px 0 0;
        }

        .modal-body {
            padding: 24px;
        }

        @media (max-width: 992px) {
            .sidebar {
                left: -260px;
            }

            .sidebar.show {
                left: 0;
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
    <!-- SweetAlert2 -->

</head>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <div class="d-flex align-items-center">
                <button class="btn btn-link text-dark d-lg-none me-3" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

        </header>

        <!-- Content Area -->
        <div class="content-wrapper">
            <div class="row g-4">
                <!-- Add Coupon Form -->
                <div class="col-lg-4 col-md-12">
                    <div class="card-custom">
                        <div class="card-header-styled">
                            <h5 class="mb-0"><i class="fas fa-plus-circle text-primary me-2"></i> Create Coupon</h5>
                        </div>
                        <div class="card-body-custom">
                            <form id="couponForm">
                                <div class="mb-4">
                                    <label class="form-label">Coupon Code</label>
                                    <div class="input-group">
                                        <input type="text" class="form-control fw-bold text-uppercase" id="code"
                                            placeholder="e.g. SAVE20" required>
                                        <button class="btn btn-outline-secondary" type="button" id="generateBtn"
                                            title="Auto Generate">

                                        </button>
                                    </div>

                                <div class="row g-3">
                                    <div class="col-6 mb-3">
                                        <label class="form-label">Type</label>
                                        <select class="form-select" id="discountType">
                                            <option value="percentage">Percentage (%)</option>

                                        </select>
                                    </div>

                                        <input type="number" class="form-control" id="discountValue" placeholder="0"

                                <div class="row g-3">

                                        </div>
                                    </div>
                                    <div class="col-6 mb-3">
                                        <label class="form-label">Usage Limit</label>
                                        <input type="number" class="form-control" id="usageLimit" placeholder="Total">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Start Date</label>
                                    <input type="date" class="form-control" id="startDate" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label">Expiry Date</label>
                                    <input type="date" class="form-control" id="expiryDate" required>
                                </div>

                                <div class="d-grid">

                                        <i class="fas fa-check-circle me-2"></i> Create Coupon
                                    </button>
                                </div>
                            </form>
                        </div>

                </div>

                <!-- Coupon List -->

                        <div class="card-header-styled">

                        </div>
                        <div class="table-responsive">

                                    <tr>
                                        <th>Code</th>

                                        <th>Min Order</th>

                                        <th>Dates</th>

    <!-- Edit Coupon Modal -->
    <div class="modal fade" id="editCouponModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="fas fa-edit text-primary me-2"></i> Edit Coupon</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editCouponForm">
                        <input type="hidden" id="editCouponId">
                        <div class="mb-3">
                            <label class="form-label">Coupon Code</label>
                            <input type="text" class="form-control fw-bold bg-light" id="editCode" readonly>
                        </div>
                        <div class="row g-3">
                            <div class="col-6 mb-3">
                                <label class="form-label">Type</label>
                                <select class="form-select" id="editDiscountType">
                                    <option value="percentage">Percentage (%)</option>
                                    <option value="fixed">Fixed (₹)</option>
                                </select>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Value</label>
                                <input type="number" class="form-control" id="editDiscountValue" required>
                            </div>
                        </div>
                        <div class="row g-3">
                            <div class="col-6 mb-3">
                                <label class="form-label">Min Order</label>
                                <input type="number" class="form-control" id="editMinOrderAmount">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Usage Limit</label>
                                <input type="number" class="form-control" id="editUsageLimit">
                            </div>
                        </div>
                        <div class="row g-3">
                            <div class="col-6 mb-4">
                                <label class="form-label">Start Date</label>
                                <input type="date" class="form-control" id="editStartDate" required>
                            </div>
                            <div class="col-6 mb-4">
                                <label class="form-label">Expiry Date</label>
                                <input type="date" class="form-control" id="editExpiryDate" required>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success shadow-sm">Update Coupon</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    <!-- Notification Script -->



    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auth Check
        const token = localStorage.getItem("adminToken");
        const role = localStorage.getItem("role");

        if (!token || role !== "admin") {
            window.location.href = "/user/login.html";
        }

        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.querySelector('.sidebar');
        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', () => {
                sidebar.classList.toggle('show');
            });
        }

        // Generate Random Code
        document.getElementById('generateBtn').addEventListener('click', () => {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 10; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('code').value = result;
        });

        let allCoupons = []; // Store fetched coupons

        // Fetch Coupons
        async function fetchCoupons() {
            const tbody = document.querySelector('tbody');
            tbody.innerHTML = '';

            try {
                const res = await fetch('/api/coupons', { headers: { 'Authorization': `Bearer ${token}` } });
                const coupons = await res.json();
                allCoupons = coupons; // Update global store

                if (coupons.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">No coupons found</td></tr>';
                    return;
                }

                coupons.forEach(c => {
                    const now = new Date();
                    const startDate = c.startDate ? new Date(c.startDate) : null;
                    const expiryDate = new Date(c.expiryDate);

                    let statusBadge;
                    if (now > expiryDate) {
                        statusBadge = '<span class="badge bg-danger">Expired</span>';
                    } else if (startDate && now < startDate) {
                        statusBadge = '<span class="badge bg-info text-dark">Upcoming</span>';
                    } else {
                        statusBadge = '<span class="badge bg-success">Active</span>';
                    }

                    const startStr = c.startDate ? new Date(c.startDate).toLocaleDateString() : '-';
                    const endStr = new Date(c.expiryDate).toLocaleDateString();

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="fw-bold text-uppercase">${c.code}</td>
                        <td>${c.discountType === 'percentage' ? c.discountValue + '%' : '₹' + c.discountValue}</td>
                        <td>₹${c.minOrderAmount}</td>
                        <td>
                            <span class="fw-bold">${c.usedCount}</span> / 
                            <span class="text-muted">${c.usageLimit ? c.usageLimit : '∞'}</span>
                        </td>
                        <td>${statusBadge}</td>
                        <td><small>${startStr} - ${endStr}</small></td>
                        <td>
                            <div class="dropdown">
                                <button class="btn btn-sm text-secondary" type="button" data-bs-toggle="dropdown">
                                    <i class="fas fa-ellipsis-v"></i>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                                    <li>
                                        <a class="dropdown-item edit-btn small" href="#" data-id="${c._id}">
                                            <i class="fas fa-edit text-primary me-2"></i> Edit
                                        </a>
                                    </li>
                                    <li>
                                        <a class="dropdown-item delete-btn text-danger small" href="#" data-id="${c._id}">
                                            <i class="fas fa-trash me-2"></i> Delete
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) { console.error(err); }
        }

        fetchCoupons();

        // Create Coupon
        document.getElementById('couponForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                code: document.getElementById('code').value,
                discountType: document.getElementById('discountType').value,
                discountValue: document.getElementById('discountValue').value,
                minOrderAmount: document.getElementById('minOrderAmount').value,
                usageLimit: document.getElementById('usageLimit').value || null,
                startDate: document.getElementById('startDate').value,
                expiryDate: document.getElementById('expiryDate').value
            };

            try {
                const res = await fetch('/api/coupons', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await res.json();
                if (res.ok) {
                    Swal.fire('Success', 'Coupon created', 'success');
                    fetchCoupons();
                    e.target.reset();
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            } catch (err) {
                Swal.fire('Error', 'Server Error', 'error');
            }
        });

        // Edit & Delete Listener
        document.querySelector('tbody').addEventListener('click', async (e) => {
            // Delete
            if (e.target.closest('.delete-btn')) {
                const id = e.target.closest('.delete-btn').dataset.id;
                Swal.fire({
                    title: 'Delete?',
                    text: "You won't be able to revert this!",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    confirmButtonText: 'Yes, delete it!'
                }).then(async (result) => {
                    if (result.isConfirmed) {
                        try {
                            const res = await fetch(`/api/coupons/${id}`, {
                                method: 'DELETE',
                                headers: { 'Authorization': `Bearer ${token}` }
                            });
                            if (res.ok) {
                                Swal.fire('Deleted!', 'Coupon has been deleted.', 'success');
                                fetchCoupons();
                            }
                        } catch (err) { Swal.fire('Error', 'Server Error', 'error'); }
                    }
                });
            }

            // Edit
            if (e.target.closest('.edit-btn')) {
                const id = e.target.closest('.edit-btn').dataset.id;
                const coupon = allCoupons.find(c => c._id === id);

                if (coupon) {
                    document.getElementById('editCouponId').value = coupon._id;
                    document.getElementById('editCode').value = coupon.code;
                    document.getElementById('editDiscountType').value = coupon.discountType;
                    document.getElementById('editDiscountValue').value = coupon.discountValue;
                    document.getElementById('editMinOrderAmount').value = coupon.minOrderAmount || 0;
                    document.getElementById('editUsageLimit').value = coupon.usageLimit || '';

                    // Format dates for input type=date (YYYY-MM-DD)
                    if (coupon.startDate) {
                        document.getElementById('editStartDate').value = new Date(coupon.startDate).toISOString().split('T')[0];
                    }
                    if (coupon.expiryDate) {
                        document.getElementById('editExpiryDate').value = new Date(coupon.expiryDate).toISOString().split('T')[0];
                    }

                    const modal = new bootstrap.Modal(document.getElementById('editCouponModal'));
                    modal.show();
                }
            }
        });

        // Update Coupon Handler
        document.getElementById('editCouponForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('editCouponId').value;
            const data = {
                code: document.getElementById('editCode').value,
                discountType: document.getElementById('editDiscountType').value,
                discountValue: document.getElementById('editDiscountValue').value,
                minOrderAmount: document.getElementById('editMinOrderAmount').value,
                usageLimit: document.getElementById('editUsageLimit').value || null,
                startDate: document.getElementById('editStartDate').value,
                expiryDate: document.getElementById('editExpiryDate').value
            };

            try {
                const res = await fetch(`/api/coupons/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (res.ok) {
                    // Hide Modal
                    const modalEl = document.getElementById('editCouponModal');
                    const modalInstance = bootstrap.Modal.getInstance(modalEl);
                    modalInstance.hide();

                    Swal.fire('Success', 'Coupon updated', 'success');
                    fetchCoupons();
                } else {
                    Swal.fire('Error', result.message, 'error');
                }

            } catch (err) {
                Swal.fire('Error', 'Server Error', 'error');
            }
        });

        // Date Validation Helper
        function setupDateValidation(startId, expiryId) {
            const startInput = document.getElementById(startId);
            const expiryInput = document.getElementById(expiryId);

            if (!startInput || !expiryInput) return;

            function validate() {
                if (startInput.value) {
                    expiryInput.min = startInput.value;

                    if (expiryInput.value && expiryInput.value < startInput.value) {
                        expiryInput.value = '';
                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            icon: 'warning',
                            title: 'Expiry date reset: cannot be earlier than Start Date',
                            showConfirmButton: false,
                            timer: 3000
                        });
                    }
                }
            }

            startInput.addEventListener('change', validate);
            expiryInput.addEventListener('change', validate);
        }

        setupDateValidation('startDate', 'expiryDate');
        setupDateValidation('editStartDate', 'editExpiryDate');


    </script>
