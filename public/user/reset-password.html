<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM Store - Reset Password</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        :root {
            --primary-green: #2ecc71;
            /* Adjust to match image */
            --dark-green: #27ae60;
            --light-green-bg: #d4efdf;
            --yellow-accent: #f1c40f;
            --text-dark: #333;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
            color: var(--text-dark);
        }

        /* Custom Colors */
        .bg-primary-custom {
            background-color: var(--primary-green) !important;
        }

        .text-primary-custom {
            color: var(--primary-green) !important;
        }

        .btn-primary-custom {
            background-color: var(--primary-green);
            border-color: var(--primary-green);
        }

        .btn-primary-custom:hover {
            background-color: var(--dark-green);
            border-color: var(--dark-green);
        }

        /* Header */
        header {
            position: relative;
            padding-bottom: 50px;
            /* Space for the curve */
        }

        .form-control:focus {
            box-shadow: none;
            border-color: var(--primary-green);
        }
    </style>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <header class="bg-primary-custom text-white py-3">
        <div class="container text-center">
            <a href="homepage.html" class="navbar-brand fw-bold fs-3 text-white">
                <i class="fas fa-leaf me-2"></i>KM Store
            </a>
        </div>
    </header>

    <div class="container d-flex flex-grow-1 align-items-center justify-content-center py-5">
        <div class="card border-0 shadow-lg p-4" style="max-width: 450px; width: 100%; border-radius: 15px;">
            <div class="text-center mb-4">
                <div class="bg-light d-inline-flex justify-content-center align-items-center rounded-circle mb-3"
                    style="width: 70px; height: 70px;">
                    <i class="fas fa-lock fa-2x text-primary-custom"></i>
                </div>
                <h3 class="fw-bold text-dark">Reset Password</h3>
                <p class="text-muted small">Enter your new password below.</p>
            </div>

            <form id="resetPasswordForm">
                <div class="mb-4">
                    <label for="newPassword" class="form-label small text-muted">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i
                                class="fas fa-key text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 ps-0 shadow-none" id="newPassword"
                            placeholder="********" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label small text-muted">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i
                                class="fas fa-key text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 ps-0 shadow-none" id="confirmPassword"
                            placeholder="********" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 rounded-3 fw-bold mb-3">Reset
                    Password</button>
            </form>
        </div>
    </div>

    <footer class="text-center py-3 text-muted small bg-white">
        &copy; 2024 KM Store. All rights reserved.
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const resetToken = urlParams.get('resetToken');

        if (!resetToken) {
            Swal.fire('Error', 'Invalid or missing reset token', 'error').then(() => {
                window.location.href = 'login.html';
            });
        }

        document.getElementById('resetPasswordForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                Swal.fire('Error', 'Passwords do not match', 'error');
                return;
            }

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resetToken, newPassword })
                });
                const data = await res.json();

                if (!res.ok) {
                    Swal.fire('Error', data.message || 'Reset failed', 'error');
                    return;
                }

                Swal.fire('Success', 'Password reset successfully!', 'success').then(() => {
                    window.location.href = 'login.html';
                });
            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'Something went wrong', 'error');
            }
        });
    </script>

</body>

</html>
