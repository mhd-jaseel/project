<!-- Header Section -->
<header class="bg-primary-custom text-white">
    <div class="container py-2">
        <div class="row align-items-center">
            <!-- Logo -->
            <div class="col-md-3">
                <a href="/user/homepage.html" class="navbar-brand fw-bold fs-3 text-white">
                    <i class="fas fa-leaf me-2"></i>KM Store
                </a>
            </div>

            <!--search bar-->
            <div class="col-md-5">
                <form id="globalSearchForm" class="position-relative">

                    <div class="input-group">
                        <input type="text" id="globalSearchInput" class="form-control border-0"
                            placeholder="Search for products..." autocomplete="off">

                        <button class="btn btn-light text-primary-custom" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>

                    <!--  Suggestions Dropdown -->
                    <div id="searchSuggestions" class="list-group position-absolute w-100 shadow"
                        style="top: 100%; left: 0; z-index: 1000; display: none; border-radius: 8px;">
                    </div>

                </form>
            </div>
            <!-- User Actions -->
            <div class="col-md-4 text-end">
                <a href="/user/wishlist.html" class="text-white text-decoration-none me-3" id="headerWishlistBtn"><i
                        class="fas fa-heart me-1"></i>
                    Wishlist</a>
                <a href="/user/cart.html" class="text-white text-decoration-none me-3" id="headerCartBtn"><i
                        class="fas fa-shopping-cart me-1"></i>
                    Cart</a>

                <!-- Dynamic Auth Section -->
                <span id="auth-actions">
                    <!-- Default to Login -->
                    <a href="/user/login.html" class="text-white text-decoration-none me-3" id="headerLoginBtn"><i
                            class="fas fa-sign-in-alt me-1"></i>
                        Login</a>
                </span>
            </div>
        </div>
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-dark p-0 mt-2">
            <div class="container-fluid p-0">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="/user/homepage.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="/user/about.html">About</a></li>
                        <li class="nav-item"><a class="nav-link" href="/user/contact.html">Contact</a></li>
                        <li class="nav-item"><a class="nav-link" href="/user/product.html">Products</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>
    <!-- Curve SVG at the bottom -->
    <div class="header-curve">
        <svg viewBox="0 0 1440 100" xmlns="http://www.w3.org/2000/svg">
            <path fill="#ffffff"
                d="M0,64L80,69.3C160,75,320,85,480,80C640,75,800,53,960,48C1120,43,1280,53,1360,58.7L1440,64L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320L0,320Z">
            </path>
        </svg>
    </div>
</header>

<script>
    function initNavbarLogic() {
        // === AUTH LOGIC ===
        updateHeaderAuth();

        // Highlight Active Link
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
            if (link.getAttribute('href') === currentPath || (currentPath === '/' && link.getAttribute('href') === '/user/homepage.html')) {
                link.classList.add('active');
            }
        });

        // === SEARCH LOGIC ===
        const input = document.getElementById("globalSearchInput");
        const form = document.getElementById("globalSearchForm");
        const suggestionsBox = document.getElementById("searchSuggestions");

        if (!input) return;

        let debounceTimer;

        function debounce(func, delay) {
            return function (...args) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => func.apply(this, args), delay);
            };
        }

        function highlightMatch(text, keyword) {
            const regex = new RegExp(`(${keyword})`, "gi");
            return text.replace(regex, `<span class="text-success fw-bold">$1</span>`);
        }

        function saveRecentSearch(keyword) {
            let recent = JSON.parse(localStorage.getItem("recentSearches")) || [];
            recent = recent.filter(item => item !== keyword);
            recent.unshift(keyword);
            if (recent.length > 5) recent.pop();
            localStorage.setItem("recentSearches", JSON.stringify(recent));
        }

        function showRecentSearches() {
            let recent = JSON.parse(localStorage.getItem("recentSearches")) || [];
            if (!recent.length) return;

            suggestionsBox.innerHTML = `
            <div class="list-group-item text-muted small">Recent Searches</div>
            ${recent.map(item => `
                <a href="product.html?search=${item}"
                class="list-group-item list-group-item-action">
                    <i class="fas fa-clock me-2 text-secondary"></i>${item}
                </a>
            `).join("")}
        `;
            suggestionsBox.style.display = "block";
        }

        async function fetchSuggestions(keyword) {

            if (!keyword) {
                showRecentSearches();
                return;
            }

            try {
                const res = await fetch(`/api/products?search=${keyword}&limit=5`);
                const data = await res.json();
                const products = data.products || data;

                if (!products.length) {
                    suggestionsBox.innerHTML = `
                    <div class="list-group-item text-muted">
                        No products found
                    </div>
                `;
                    suggestionsBox.style.display = "block";
                    return;
                }

                suggestionsBox.innerHTML = products.map(p => `
                <a href="single-product.html?id=${p._id}"
                class="list-group-item list-group-item-action d-flex gap-2 align-items-center">
                
                    <img src="${p.image || 'https://placehold.co/40'}"
                        width="40"
                        height="40"
                        style="object-fit:contain;">

                    <div class="flex-grow-1">
                        <div>${highlightMatch(p.name, keyword)}</div>
                        <small class="text-muted">
                            ${p.category ? p.category.name : ""}
                        </small>
                    </div>

                    <div class="text-success fw-semibold">
                        ₹${p.price}
                    </div>
                </a>
            `).join("");

                suggestionsBox.style.display = "block";

            } catch (err) {
                console.error("Search suggestion error", err);
            }
        }

        const debouncedSearch = debounce(fetchSuggestions, 400);

        input.addEventListener("input", function () {
            debouncedSearch(this.value.trim());
        });

        input.addEventListener("focus", function () {
            if (!this.value.trim()) showRecentSearches();
        });

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            const keyword = input.value.trim();
            if (!keyword) return;

            saveRecentSearch(keyword);
            window.location.href = `product.html?search=${encodeURIComponent(keyword)}`;
        });

        document.addEventListener("click", function (e) {
            if (!form.contains(e.target)) {
                suggestionsBox.style.display = "none";
            }
        });
    }

    // === UTILS ===
    function getToken() {
        return localStorage.getItem("userToken");
    }

    function checkLogin(e) {
        const token = getToken();
        if (!token) {
            e?.preventDefault();
            Swal.fire({
                title: "Login Required",
                text: "Please login to continue",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Login",
                confirmButtonColor: "#2ecc71"
            }).then(res => {
                if (res.isConfirmed) window.location.href = "login.html";
            });
            return false;
        }
        return true;
    }

    function updateHeaderAuth() {
        const authContainer = document.getElementById("auth-actions");
        if (!authContainer) return;

        if (getToken()) {
            authContainer.innerHTML = `
<div class="dropdown d-inline-block">
<a href="#" class="text-white text-decoration-none dropdown-toggle"
   data-bs-toggle="dropdown">
  <i class="fas fa-user me-1"></i> Account
</a>
<ul class="dropdown-menu dropdown-menu-end">
  <li><a class="dropdown-item" href="account.html">My Account</a></li>
    <li><a class="dropdown-item" href="my-orders.html">My Orders</a></li>
  <li><hr class="dropdown-divider"></li>
  <li><a class="dropdown-item text-danger" href="#" id="headerLogoutBtn">Logout</a></li>
</ul>
</div>
`;

            setTimeout(() => {
                const logoutBtn = document.getElementById("headerLogoutBtn");
                if (logoutBtn) {
                    logoutBtn.onclick = e => {
                        e.preventDefault();
                        localStorage.removeItem("userToken");
                        localStorage.removeItem("role");
                        localStorage.removeItem("user");
                        window.location.href = "login.html";
                    };
                }
            }, 100);

        } else {
            authContainer.innerHTML = `
<a href="login.html" class="text-white text-decoration-none">
<i class="fas fa-sign-in-alt me-1"></i> Login
</a>
`;
        }
    }

    // Run Initialization
    initNavbarLogic();
</script>
