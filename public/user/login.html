<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM Store - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        :root {
            --primary-green: #2ecc71;
            --dark-green: #27ae60;
            --light-green-bg: #eafaf1;
            --yellow-accent: #f1c40f;
            --text-dark: #2c3e50;
        }

        body {
            overflow-y: scroll;
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
            color: var(--text-dark);
        }


        .btn-primary-custom {
            background-color: var(--primary-green);
            border-color: var(--primary-green);
            color: white;
        }

        .btn-primary-custom:hover {
            background-color: var(--dark-green);
            border-color: var(--dark-green);
            color: white;
        }

        .text-primary-custom {
            color: var(--primary-green) !important;
        }

        .header-logo {
            font-size: 24px;
            font-weight: 700;
            color: #2c3e50;
            text-decoration: none !important;
            display: flex;
            align-items: center;
        }

        .header-logo i {
            color: var(--primary-green);
        }

        @media (max-width: 768px) {
            .header-logo {
                font-size: 20px !important;
            }
        }
    </style>


    <script>
        // Global Auth / Block Check
        (async function () {
            const token = localStorage.getItem('userToken');
            if (!token) return;

            try {
                const res = await fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } });
                if (res.status === 403) {
                    const data = await res.json();
                    if (data.isBlocked) {
                        const styleTag = document.createElement('style');
                        styleTag.innerHTML = 'body { margin: 0; padding: 0; overflow: hidden; }';
                        document.head.appendChild(styleTag);

                        document.body.innerHTML = `
                            <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff; font-family: sans-serif; text-align: center; padding: 20px;">
                                <div>
                                    <h1 style="color: #e74c3c; margin-bottom: 20px;">Admin has blocked your account.</h1>
                                    <p style="font-size: 1.1rem; color: #555; margin-bottom: 30px;">You no longer have permission to access this system.<br>If you believe this is a mistake, please contact the admin.</p>
                                    <button id="showEmailBtn" style="background: #2ecc71; color: white; padding: 12px 24px; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-bottom: 20px;">Contact Admin</button>
                                    
                                    <form id="adminEmailForm" style="display: none; max-width: 400px; margin: 0 auto; text-align: left; background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd;">
                                        <div style="margin-bottom: 15px;">
                                            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Subject</label>
                                            <input type="text" id="adminSubj" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                                        </div>
                                        <div style="margin-bottom: 15px;">
                                            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Message</label>
                                            <textarea id="adminMsg" rows="4" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"></textarea>
                                        </div>
                                        <button type="submit" style="width: 100%; background: #2ecc71; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer;">Send Message</button>
                                    </form>
                                </div>
                            </div>
                        `;

                        document.getElementById('showEmailBtn').addEventListener('click', function () {
                            this.style.display = 'none';
                            document.getElementById('adminEmailForm').style.display = 'block';
                        });

                        document.getElementById('adminEmailForm').addEventListener('submit', async function (e) {
                            e.preventDefault();
                            const subject = document.getElementById('adminSubj').value;
                            const message = document.getElementById('adminMsg').value;
                            try {
                                await fetch('/api/contact/send', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ name: data.name || 'User', email: data.email || 'Blocked', subject, message })
                                });
                            } catch (error) { }

                            document.body.innerHTML = `
                                 <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif;">
                                     <h1 style="color: #2ecc71;">Message Sent!</h1>
                                     <p>Redirecting to signup...</p>
                                 </div>
                             `;

                            localStorage.removeItem('userToken');
                            localStorage.removeItem('user');
                            localStorage.removeItem('role');

                            setTimeout(() => { window.location.href = 'signup.html'; }, 2000);
                        });

                        throw new Error('User is blocked');
                    }
                }
            } catch (e) { }
        })();
    </script>

</head>

<body class="bg-light d-flex flex-column min-vh-100">
    <!-- Simple Navbar for Logo -->
    <nav class="navbar navbar-light bg-white border-bottom py-3">
        <div class="container-fluid px-4 px-lg-5 justify-content-center justify-content-md-start">
            <a href="/user/homepage.html" class="header-logo text-nowrap">
                <i class="fas fa-leaf me-2"></i>KM Store
            </a>
        </div>
    </nav>


    <div class="container-fluid px-4 px-lg-5 d-flex flex-grow-1 align-items-center justify-content-center py-5">
        <div class="card border-0 shadow-lg p-4" style="max-width: 450px; width: 100%; border-radius: 15px;">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark">Welcome Back</h3>
                <p class="text-muted small">Login to your account to continue</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label small text-muted">Email Address</label>
                    <div class="input-group has-validation">
                        <span class="input-group-text bg-white border-end-0"><i
                                class="fas fa-envelope text-muted"></i></span>
                        <input type="email" class="form-control border-start-0 ps-0 shadow-none" id="email"
                            placeholder="name@example.com">
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label small text-muted">Password</label>
                    <div class="input-group has-validation">
                        <span class="input-group-text bg-white border-end-0"><i
                                class="fas fa-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 border-end-0 ps-0 shadow-none"
                            id="password" placeholder="********">
                        <span class="input-group-text bg-white border-start-0" style="cursor: pointer;"
                            id="togglePasswordBtn">
                            <i class="fas fa-eye text-muted" id="togglePasswordIcon"></i>
                        </span>
                        <div class="invalid-feedback">Password is required.</div>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                    </div>
                    <a href="forgot-password.html" class="small text-decoration-none text-primary-custom">Forgot
                        Password?</a>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 rounded-3 fw-bold mb-3">Login</button>

                <div class="text-center small text-muted mb-3">Or login with</div>

                <div class="mb-4">
                    <a href="/api/auth/google" class="btn btn-outline-secondary w-100">
                        <i class="fab fa-google text-danger me-2"></i>
                        Continue with Google
                    </a>
                </div>

                <div class="text-center small">
                    <span class="text-muted">Don't have an account?</span>
                    <a href="/user/signup.html" class="text-primary-custom fw-bold text-decoration-none">Sign Up</a>
                </div>
            </form>
        </div>
    </div>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById("loginForm");

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        document.getElementById("togglePasswordBtn").addEventListener("click", () => {
            togglePasswordVisibility("password", "togglePasswordIcon");
        });

        function validateEmail(input) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (re.test(input.value)) {
                input.classList.remove('is-invalid');
                input.classList.add('is-valid');
                return true;
            } else {
                input.classList.remove('is-valid');
                input.classList.add('is-invalid');
                return false;
            }
        }

        function validatePassword(input) {
            if (input.value.trim().length > 0) {
                input.classList.remove('is-invalid');
                input.classList.add('is-valid');
                return true;
            } else {
                input.classList.remove('is-valid');
                input.classList.add('is-invalid');
                return false;
            }
        }

        const emailInput = document.getElementById('email');
        const passInput = document.getElementById('password');

        emailInput.addEventListener('input', () => validateEmail(emailInput));
        emailInput.addEventListener('blur', () => validateEmail(emailInput));
        passInput.addEventListener('input', () => validatePassword(passInput));
        passInput.addEventListener('blur', () => validatePassword(passInput));

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const v1 = validateEmail(emailInput);
            const v2 = validatePassword(passInput);

            if (!v1 || !v2) return;

            const email = emailInput.value;
            const password = passInput.value;

            localStorage.removeItem("adminToken");
            localStorage.removeItem("userToken");

            try {
                const submitBtn = form.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> ...';

                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;

                if (!res.ok) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Login Failed',
                        text: data.message || 'Invalid credentials'
                    });
                    return;
                }

                localStorage.setItem("role", data.role);
                if (data.role === "admin") {
                    localStorage.setItem("adminToken", data.token);
                    window.location.href = "/admin/dashboard.html";
                } else {
                    localStorage.setItem("userToken", data.token);
                    window.location.href = "/user/homepage.html";
                }
            } catch (err) {
                console.error(err);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: "Network error"
                });
                const submitBtn = form.querySelector('button[type="submit"]');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Login';
            }
        });
    </script>
</body>

</html>
