<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM Store - Sign Up</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <style>:root {
    --primary-green: #2ecc71;
    /* Adjust to match image */
    --dark-green: #27ae60;
    --light-green-bg: #d4efdf;
    --yellow-accent: #f1c40f;
    --text-dark: #333;
}

body {
    font-family: 'Poppins', sans-serif;
    background-color: #ffffff;
    color: var(--text-dark);
}

/* Custom Colors */
.bg-primary-custom {
    background-color: var(--primary-green) !important;
}

.text-primary-custom {
    color: var(--primary-green) !important;
}

.btn-primary-custom {
    background-color: var(--primary-green);
    border-color: var(--primary-green);
}

.btn-primary-custom:hover {
    background-color: var(--dark-green);
    border-color: var(--dark-green);
}

/* Header */
header {
    position: relative;
    padding-bottom: 50px;
    /* Space for the curve */
}

.header-curve {
    position: absolute;
    bottom: -1px;
    width: 100%;
    overflow: hidden;
    line-height: 0;
}

.header-curve svg {
    display: block;
    width: calc(100% + 1.3px);
    height: 60px;
}

.header-curve path {
    fill: #ffffff;
}

/* Hero Section */
.bg-light-green {
    background-color: #a8e6cf;
    /* Lighter mint green */
}

.yellow-circle {
    position: absolute;
    width: 250px;
    height: 250px;
    background-color: #f7dc6f;
    border-radius: 50%;
    bottom: -50px;
    right: -50px;
    z-index: 0;
}

.hero-img {
    position: relative;
    z-index: 1;
}

/* Categories */
.category-circle {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #fff;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s ease;
}

.category-circle:hover {
    transform: scale(1.05);
}

/* Product Cards */
.product-card {
    border-radius: 15px;
    /* Softer rounded corners */
    transition: box-shadow 0.3s ease;
    padding: 15px;
    background: #fff;
    border: 1px solid #f0f0f0;
    /* Subtle border */
}

.product-card:hover {
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08) !important;
}

.product-card img.card-img-top {
    height: 180px;
    /* Fixed height for consistency */
    object-fit: contain;
}

.product-title {
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 0.2rem;
    color: #000;
}

.product-weight {
    color: #777;
    font-size: 0.9rem;
}

.product-price {
    font-size: 1.2rem;
    font-weight: 700;
    color: #000;
}

/* Wishlist Styles */
.wishlist-card {
    transition: all 0.3s ease;
    overflow: hidden;
}

.wishlist-card:hover {
    box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15) !important;
}

.wishlist-img-wrapper {
    height: 200px;
    /* Fixed height */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
}

.wishlist-img-wrapper img {
    max-height: 100%;
    max-width: 100%;
    object-fit: contain;
}

.btn-remove-wishlist {
    width: 35px;
    height: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    background: white;
}

.btn-remove-wishlist:hover {
    background-color: #f8d7da;
    color: #dc3545;
}

.btn-add-cart-wishlist {
    background-color: black;
    color: white;
    border: none;
    transition: all 0.3s;
}

.btn-add-cart-wishlist:hover {
    background-color: #333;
    color: white;
}

/* Checkout Styles */
.form-control:focus {
    box-shadow: none;
    border-color: #db4444;
    /* Match the red accent */
}

.checkout-item-img {
    width: 50px;
    height: 50px;
    object-fit: contain;
}

.product-price-old {
    text-decoration: line-through;
    color: #bbb;
    font-size: 0.9rem;
    margin-left: 8px;
}

/* Badges */
.badge-best-deal {
    background-color: #a8e6cf;
    /* Light green from image */
    color: #2c3e50;
    font-weight: 500;
    border-radius: 4px 0 10px 0;
    /* Stylized corner if needed, or simple rounded */
    padding: 5px 10px;
    font-size: 0.9rem;
    z-index: 2;
}

/* Action Buttons */
.btn-wishlist {
    width: 45px;
    height: 45px;
    border: 1px solid var(--primary-green);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #000;
    background: #fff;
    transition: all 0.2s;
}

.btn-wishlist:hover {
    background-color: #f0fff4;
}

.btn-add-cart {
    background-color: var(--primary-green);
    color: white;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    padding: 10px 0;
    width: 100%;
    transition: background-color 0.2s;
}

.btn-add-cart:hover {
    background-color: var(--dark-green);
    color: white;
}

/* Single Product Page Styles */
.thumbnail-img {
    cursor: pointer;
    transition: all 0.2s;
}

.thumbnail-img:hover {
    border-color: var(--primary-green) !important;
}

.quantity-selector input:focus {
    box-shadow: none;
    outline: none;
}

.btn-add-cart-lg {
    background-color: var(--primary-green);
    color: white;
    font-weight: 700;
    font-size: 1.1rem;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    transition: background-color 0.2s;
}

.btn-add-cart-lg:hover {
    background-color: var(--dark-green);
    color: white;
}


/* Features Info Section */
.icon-circle {
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #e8f5e9 !important;
    /* Very light green */
    color: var(--dark-green) !important;
}

/* Scrollbar hiding for horizontal scrolls if added later */
::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-thumb {
    background: #ccc;
    border-radius: 4px;
}

/* Sidebar Styles */
.sidebar {
    background-color: #f8f9fa;
    border-radius: 12px;
}

.form-check-input:checked {
    background-color: var(--primary-green);
    border-color: var(--primary-green);
}

.form-check-label {
    cursor: pointer;
}




.btn-outline-custom {
    color: var(--dark-green);
    border-color: var(--primary-green);
    background-color: #fff;
}

.btn-outline-custom:hover {
    background-color: var(--primary-green);
    color: white;
}

/* Cart Page Styles */
.cart-img-wrapper {
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #fff;
}

.cart-img-wrapper img {
    max-height: 100%;
    max-width: 100%;
    object-fit: contain;
}

.quantity-selector-sm {
    width: fit-content;
}

.table> :not(caption)>*>* {
    background-color: transparent;
    /* Fix default BS table bg */
}

thead th {
    font-weight: 500;
    color: #555;
    font-size: 0.9rem;
}

/* Account Page Styles */
.active-link {
    color: var(--primary-green) !important;
    font-weight: 600;
}

.account-sidebar a:hover {
    color: var(--primary-green) !important;
}</style>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <header class="bg-primary-custom text-white py-3">
        <div class="container text-center">
            <a href="homepage.html" class="navbar-brand fw-bold fs-3 text-white">
                <i class="fas fa-leaf me-2"></i>KM Store
            </a>
        </div>
    </header>

    <div class="container d-flex flex-grow-1 align-items-center justify-content-center py-5">
        <div class="card border-0 shadow-lg p-4" style="max-width: 450px; width: 100%; border-radius: 15px;">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark">Create Account</h3>
                <p class="text-muted small">Join us today!</p>
            </div>

            <form id="signupForm">
                <div class="mb-3">
                    <label for="fullName" class="form-label small text-muted">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i
                                class="fas fa-user text-muted"></i></span>
                        <input type="text" class="form-control border-start-0 ps-0 shadow-none" id="fullName"
                            placeholder="John Doe" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label small text-muted">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i
                                class="fas fa-envelope text-muted"></i></span>
                        <input type="email" class="form-control border-start-0 ps-0 shadow-none" id="email"
                            placeholder="name@example.com" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label small text-muted">Phone Number</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i
                                class="fas fa-phone text-muted"></i></span>
                        <input type="tel" class="form-control border-start-0 ps-0 shadow-none" id="phone"
                            placeholder="+1 234 567 890" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label small text-muted">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i
                                class="fas fa-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 ps-0 shadow-none" id="password"
                            placeholder="********" required>
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="terms" required>
                    <label class="form-check-label small text-muted" for="terms">
                        I agree to the <a href="#" class="text-primary-custom text-decoration-none">Terms &
                            Conditions</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 rounded-3 fw-bold mb-3">Sign Up</button>

                <div class="text-center small">
                    <span class="text-muted">Already have an account?</span>
                    <a href="login.html" class="text-primary-custom fw-bold text-decoration-none">Login</a>
                </div>
            </form>
        </div>
    </div>

    <footer class="text-center py-3 text-muted small bg-white">
        &copy; 2024 KM Store. All rights reserved.
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- custom JS (login/signup logic) -->
     <script>
  const form = document.getElementById("signupForm");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const name = document.getElementById("fullName").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      const res = await fetch("/api/auth/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ name, email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        alert(data.message || "Signup failed");
        return;
      }

      alert("Signup successful. Please login.");
      window.location.href = "/user/login.html";

    } catch (err) {
      console.error(err);
      alert("Something went wrong");
    }
  });
</script>

</body>

</html>
