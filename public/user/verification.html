<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM Store - Verification</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        :root {
            --primary-green: #2ecc71;
            /* Adjust to match image */
            --dark-green: #27ae60;
            --light-green-bg: #d4efdf;
            --yellow-accent: #f1c40f;
            --text-dark: #333;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
            color: var(--text-dark);
        }

        /* Custom Colors */
        .bg-primary-custom {
            background-color: var(--primary-green) !important;
        }

        .text-primary-custom {
            color: var(--primary-green) !important;
        }

        .btn-primary-custom {
            background-color: var(--primary-green);
            border-color: var(--primary-green);
        }

        .btn-primary-custom:hover {
            background-color: var(--dark-green);
            border-color: var(--dark-green);
        }

        /* Header */
        header {
            position: relative;
            padding-bottom: 50px;
            /* Space for the curve */
        }

        .header-curve {
            position: absolute;
            bottom: -1px;
            width: 100%;
            overflow: hidden;
            line-height: 0;
        }

        .header-curve svg {
            display: block;
            width: calc(100% + 1.3px);
            height: 60px;
        }

        .header-curve path {
            fill: #ffffff;
        }

        /* Hero Section */
        .bg-light-green {
            background-color: #a8e6cf;
            /* Lighter mint green */
        }

        .yellow-circle {
            position: absolute;
            width: 250px;
            height: 250px;
            background-color: #f7dc6f;
            border-radius: 50%;
            bottom: -50px;
            right: -50px;
            z-index: 0;
        }

        .hero-img {
            position: relative;
            z-index: 1;
        }

        /* Categories */
        .category-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .category-circle:hover {
            transform: scale(1.05);
        }

        /* Product Cards */
        .product-card {
            border-radius: 15px;
            /* Softer rounded corners */
            transition: box-shadow 0.3s ease;
            padding: 15px;
            background: #fff;
            border: 1px solid #f0f0f0;
            /* Subtle border */
        }

        .product-card:hover {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08) !important;
        }

        .product-card img.card-img-top {
            height: 180px;
            /* Fixed height for consistency */
            object-fit: contain;
        }

        .product-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.2rem;
            color: #000;
        }

        .product-weight {
            color: #777;
            font-size: 0.9rem;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: #000;
        }

        /* Wishlist Styles */
        .wishlist-card {
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .wishlist-card:hover {
            box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15) !important;
        }

        .wishlist-img-wrapper {
            height: 200px;
            /* Fixed height */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .wishlist-img-wrapper img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .btn-remove-wishlist {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: white;
        }

        .btn-remove-wishlist:hover {
            background-color: #f8d7da;
            color: #dc3545;
        }

        .btn-add-cart-wishlist {
            background-color: black;
            color: white;
            border: none;
            transition: all 0.3s;
        }

        .btn-add-cart-wishlist:hover {
            background-color: #333;
            color: white;
        }

        /* Checkout Styles */
        .form-control:focus {
            box-shadow: none;
            border-color: #db4444;
            /* Match the red accent */
        }

        .checkout-item-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .product-price-old {
            text-decoration: line-through;
            color: #bbb;
            font-size: 0.9rem;
            margin-left: 8px;
        }

        /* Badges */
        .badge-best-deal {
            background-color: #a8e6cf;
            /* Light green from image */
            color: #2c3e50;
            font-weight: 500;
            border-radius: 4px 0 10px 0;
            /* Stylized corner if needed, or simple rounded */
            padding: 5px 10px;
            font-size: 0.9rem;
            z-index: 2;
        }

        /* Action Buttons */
        .btn-wishlist {
            width: 45px;
            height: 45px;
            border: 1px solid var(--primary-green);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            background: #fff;
            transition: all 0.2s;
        }

        .btn-wishlist:hover {
            background-color: #f0fff4;
        }

        .btn-add-cart {
            background-color: var(--primary-green);
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            padding: 10px 0;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn-add-cart:hover {
            background-color: var(--dark-green);
            color: white;
        }

        /* Single Product Page Styles */
        .thumbnail-img {
            cursor: pointer;
            transition: all 0.2s;
        }

        .thumbnail-img:hover {
            border-color: var(--primary-green) !important;
        }

        .quantity-selector input:focus {
            box-shadow: none;
            outline: none;
        }

        .btn-add-cart-lg {
            background-color: var(--primary-green);
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            transition: background-color 0.2s;
        }

        .btn-add-cart-lg:hover {
            background-color: var(--dark-green);
            color: white;
        }


        /* Features Info Section */
        .icon-circle {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #e8f5e9 !important;
            /* Very light green */
            color: var(--dark-green) !important;
        }

        /* Scrollbar hiding for horizontal scrolls if added later */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        /* Sidebar Styles */
        .sidebar {
            background-color: #f8f9fa;
            border-radius: 12px;
        }

        .form-check-input:checked {
            background-color: var(--primary-green);
            border-color: var(--primary-green);
        }

        .form-check-label {
            cursor: pointer;
        }




        .btn-outline-custom {
            color: var(--dark-green);
            border-color: var(--primary-green);
            background-color: #fff;
        }

        .btn-outline-custom:hover {
            background-color: var(--primary-green);
            color: white;
        }

        /* Cart Page Styles */
        .cart-img-wrapper {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
        }

        .cart-img-wrapper img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .quantity-selector-sm {
            width: fit-content;
        }

        .table> :not(caption)>*>* {
            background-color: transparent;
            /* Fix default BS table bg */
        }

        thead th {
            font-weight: 500;
            color: #555;
            font-size: 0.9rem;
        }

        /* Account Page Styles */
        .active-link {
            color: var(--primary-green) !important;
            font-weight: 600;
        }

        .account-sidebar a:hover {
            color: var(--primary-green) !important;
        }
    </style>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <header class="bg-primary-custom text-white py-3">
        <div class="container text-center">
            <a href="homepage.html" class="navbar-brand fw-bold fs-3 text-white">
                <i class="fas fa-leaf me-2"></i>KM Store
            </a>
        </div>
    </header>

    <div class="container d-flex flex-grow-1 align-items-center justify-content-center py-5">
        <div class="card border-0 shadow-lg p-4" style="max-width: 450px; width: 100%; border-radius: 15px;">
            <div class="text-center mb-4">
                <div class="bg-light d-inline-flex justify-content-center align-items-center rounded-circle mb-3"
                    style="width: 70px; height: 70px;">
                    <i class="fas fa-shield-alt fa-2x text-primary-custom"></i>
                </div>
                <h3 class="fw-bold text-dark">Verification</h3>
                <p class="text-muted small">Enter the 4-digit code sent to your email.</p>
            </div>

            <form id="verification-form">
                <div class="d-flex justify-content-center gap-2 mb-4">
                    <input type="text" class="form-control text-center fs-4 fw-bold shadow-none" maxlength="1"
                        style="width: 40px; height: 50px;">
                    <input type="text" class="form-control text-center fs-4 fw-bold shadow-none" maxlength="1"
                        style="width: 40px; height: 50px;">
                    <input type="text" class="form-control text-center fs-4 fw-bold shadow-none" maxlength="1"
                        style="width: 40px; height: 50px;">
                    <input type="text" class="form-control text-center fs-4 fw-bold shadow-none" maxlength="1"
                        style="width: 40px; height: 50px;">
                    <input type="text" class="form-control text-center fs-4 fw-bold shadow-none" maxlength="1"
                        style="width: 40px; height: 50px;">
                    <input type="text" class="form-control text-center fs-4 fw-bold shadow-none" maxlength="1"
                        style="width: 40px; height: 50px;">
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 rounded-3 fw-bold mb-3">Verify</button>

                <div class="text-center small">
                    <span class="text-muted">Didn't receive code?</span>
                    <a href="#" class="text-primary-custom fw-bold text-decoration-none">Resend</a>
                </div>

                <div class="text-center small mt-3">
                    <a href="login.html" class="text-muted text-decoration-none"><i class="fas fa-arrow-left me-1"></i>
                        Back to Login</a>
                </div>
            </form>
        </div>
    </div>

    <footer class="text-center py-3 text-muted small bg-white">
        &copy; 2024 KM Store. All rights reserved.
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simple auto-focus script for OTP inputs
        const inputs = document.querySelectorAll('.form-control[maxlength="1"]');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // URL Params
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        const purpose = urlParams.get('purpose');

        // Update UI based on purpose
        if (purpose === 'forgot-password') {
            document.querySelector('h3').textContent = 'Reset Password';
            document.querySelector('.text-muted.small').textContent = 'Enter the code sent to your email to reset password.';
        }

        document.getElementById('verification-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            // Collect OTP
            let otp = '';
            inputs.forEach(input => otp += input.value);

            if (otp.length !== 6) {
                Swal.fire('Error', 'Please enter a 6-digit code', 'error');
                return;
            }

            try {
                const res = await fetch("/api/auth/verify-otp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, otp, purpose })
                });
                const data = await res.json();

                if (!res.ok) {
                    Swal.fire('Error', data.message || 'Verification failed', 'error');
                    return;
                }

                if (purpose === 'signup') {
                    Swal.fire('Success', 'Email verified!', 'success').then(() => {
                        window.location.href = 'login.html';
                    });
                } else if (purpose === 'forgot-password') {
                    Swal.fire('Success', 'Code verified!', 'success').then(() => {
                        window.location.href = `reset-password.html?resetToken=${data.resetToken}`;
                    });
                }
            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'Something went wrong', 'error');
            }
        });
    </script>
</body>

</html>
